<!DOCTYPE html>
<html lang="pt-BR" data-webappcap-state="loading" data-webappcap-shell="preview-entry">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WebAppCap — Preview</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#082720}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
  #previewBoot{position:fixed;inset:0;display:grid;place-items:center;background:#082720}
  .previewBootInner{display:grid;justify-items:center;gap:14px;text-align:center;padding:24px}
  .previewSpinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.18);border-top-color:#e3bb3d;border-radius:50%;animation:spin .7s linear infinite}
  .previewText{font:600 11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;opacity:.78}
  .previewError{max-width:560px;font:500 13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:rgba(255,255,255,.8)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.previewSpinner{animation:none}}
</style>
</head>
<body>
<div id="previewBoot">
  <div class="previewBootInner">
    <div class="previewSpinner" aria-hidden="true"></div>
    <div class="previewText">Carregando preview</div>
    <div class="previewError" id="previewError" hidden></div>
  </div>
</div>
<script>
(() => {
  const params = new URLSearchParams(window.location.search);
  const slug = String(params.get('project') || '').trim();
  const validSlug = /^[a-z0-9-]+$/i.test(slug) ? slug : null;
  const error = document.getElementById('previewError');
  const spinner = document.querySelector('.previewSpinner');
  const text = document.querySelector('.previewText');

  if (!validSlug) {
    spinner.hidden = true;
    text.textContent = 'Preview indisponível';
    error.hidden = false;
    error.textContent = 'Nenhum projeto válido foi informado. Abra o Preview pelo painel do projeto.';
    document.documentElement.dataset.webappcapState = 'error';
    return;
  }

  // Preview must use the exact same data-first shell and renderer as the
  // published multi-project site. The draft flag only changes the data source
  // in project-data.js, preserving the selected project's template/layout.
  const target = new URL('/public-shell.html', window.location.origin);
  target.searchParams.set('preview', 'draft');
  target.searchParams.set('project', validSlug);

  window.location.replace(target.pathname + target.search);
})();
</script>
</body>
</html>
