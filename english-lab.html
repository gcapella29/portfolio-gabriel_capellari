<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>English Lab | WebAppCap</title>
  <meta name="theme-color" content="#142640">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fb;color:#152d47}
    header{height:60px;background:#142640;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,3vw,36px);gap:12px}
    .brand{text-decoration:none;color:inherit;font-size:18px;font-weight:800;letter-spacing:-.4px}
    .brand span{color:#6be0b9}.actions{display:flex;gap:12px;align-items:center;font-size:13px}
    .actions a{color:#dce8f3;text-decoration:none}.actions a:hover{text-decoration:underline}
    .launch{background:#27a480!important;color:white!important;padding:10px 12px;border-radius:9px;font-weight:700}
    .frame-wrap{height:calc(100dvh - 60px);min-height:580px;position:relative}
    iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .helper{position:fixed;bottom:18px;right:18px;background:rgba(20,38,64,.96);color:#fff;box-shadow:0 10px 30px #0003;border-radius:12px;padding:12px 15px;font-size:12px;max-width:310px;z-index:2}
    .helper a{color:#78e5c1}button{background:transparent;border:0;color:#d9e4ec;cursor:pointer;font-size:17px;float:right;margin-left:9px}
    @media(max-width:520px){header{height:auto;min-height:60px;flex-wrap:wrap;padding:12px}.actions{font-size:12px}.frame-wrap{height:calc(100dvh - 85px)}}
  </style>
</head>
<body>
<header>
  <a class="brand" href="https://webappcap.com.br/">WebAppCap <span>/ English Lab</span></a>
  <nav class="actions" aria-label="Links do projeto">
    <a href="https://webappcap.com.br/">Início WebAppCap</a>
    <a class="launch" href="https://script.google.com/macros/s/AKfycbxI1i62oEoK2uy20q8uZnTHYxZwxD1-yokvxx_1ZWcZ6Xfu4APdygAH1mRCo2IOXQeg/exec" target="_blank" rel="noopener noreferrer">Abrir app ↗</a>
  </nav>
</header>
<main class="frame-wrap">
  <iframe id="englishLab" title="English Lab — área de estudos" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="microphone" src="https://script.google.com/macros/s/AKfycbxI1i62oEoK2uy20q8uZnTHYxZwxD1-yokvxx_1ZWcZ6Xfu4APdygAH1mRCo2IOXQeg/exec"></iframe>
</main>
<aside id="tip" class="helper"><button aria-label="Fechar aviso" onclick="document.getElementById('tip').remove()">×</button>Se o conteúdo não carregar nesta página, abra pelo botão <strong>Abrir app</strong>. Para habilitar a incorporação, o Apps Script precisa permitir exibição em iframe.</aside>

</html>
