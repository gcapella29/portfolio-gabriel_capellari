<!DOCTYPE html>
<html lang="pt-BR" data-webappcap-state="loading" data-webappcap-shell="data-first">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>WebAppCap</title>
<meta name="description" content="">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/media/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#082720;--secondary:#0e3b2e;--accent:#e3bb3d;--background:#f7f4ec;--surface:#fff;--text:#171310;--muted:#728078;--radius:18px;--max:1180px;--heading:'Fraunces',serif;--body:'Inter',sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--primary)}body{margin:0;background:var(--background);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}body>*{opacity:0}html[data-webappcap-state="ready"] body>*{opacity:1;transition:opacity .25s ease}html[data-webappcap-state="error"] body>*{opacity:0}a{color:inherit}img{display:block;max-width:100%}h1,h2,h3{font-family:var(--heading);margin:0}.mono{font-family:var(--mono)}
#boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:var(--primary);color:#fff;opacity:1!important}.boot-inner{display:grid;justify-items:center;gap:14px}.boot-spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}.boot-text{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.75}@keyframes spin{to{transform:rotate(360deg)}}html[data-webappcap-state="ready"] #boot{display:none}html[data-webappcap-state="error"] #boot .boot-spin{display:none}html[data-webappcap-state="error"] #boot .boot-text::after{content:'Não foi possível carregar este projeto.'}html[data-webappcap-state="error"] #boot .boot-text{font-size:0}html[data-webappcap-state="error"] #boot .boot-text::after{font-size:12px}
.hero{min-height:92svh;position:relative;display:flex;align-items:flex-end;color:#fff;background:var(--primary);overflow:hidden}.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.01)}.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(8,39,32,.78) 65%,var(--primary))}.hero-inner{position:relative;z-index:2;width:min(var(--max),calc(100% - 2.5rem));margin:0 auto;padding:7rem 0 3.2rem}.hero-top{display:flex;justify-content:flex-end;margin-bottom:clamp(5rem,12vh,9rem)}.badge{font:600 11px/1 var(--mono);letter-spacing:.06em;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:.55rem .75rem;background:rgba(0,0,0,.15);backdrop-filter:blur(8px)}.hero h1{font-size:clamp(3rem,8vw,6.5rem);line-height:.92;max-width:930px}.hero-role{margin-top:1rem;max-width:900px;font:500 clamp(.75rem,1.3vw,.95rem)/1.65 var(--mono);letter-spacing:.035em;color:rgba(255,255,255,.84)}.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.25rem}.chip{font:500 .68rem/1 var(--mono);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:.45rem .65rem}.actions{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:1.5rem}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.72rem 1rem;border-radius:999px;text-decoration:none;font:600 .7rem/1 var(--mono);border:1px solid rgba(255,255,255,.3)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--primary)}
.ticker{overflow:hidden;background:var(--accent);color:var(--primary);border-block:1px solid rgba(0,0,0,.16)}.ticker-track{display:flex;width:max-content;animation:marquee 24s linear infinite}.ticker-group{display:flex;flex-shrink:0}.ticker span{padding:.85rem 1.5rem;font:600 .7rem/1 var(--mono);white-space:nowrap}.ticker span::after{content:'◆';margin-left:1.5rem;opacity:.45;font-size:.55rem}@keyframes marquee{to{transform:translateX(-50%)}}
.section{padding:clamp(4rem,8vw,7.5rem) max(1.25rem,calc((100% - var(--max))/2))}.section.dark{background:var(--primary);color:#fff}.section.alt{background:var(--surface)}.eyebrow{font:600 .65rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:.65rem}.section h2{font-size:clamp(2rem,4vw,3.5rem);line-height:1}.lead{font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.7;color:var(--muted)}.dark .lead{color:rgba(255,255,255,.67)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:rgba(0,0,0,.08);padding:0}.stat{background:var(--secondary);color:#fff;padding:1.5rem}.stat strong{display:block;font:600 clamp(2rem,5vw,3.7rem)/1 var(--heading);color:var(--accent)}.stat span{display:block;margin-top:.5rem;font:500 .72rem/1.45 var(--mono);opacity:.72}
.about-grid,.feature-grid,.contact-grid{display:grid;gap:2rem;align-items:center}.photo{overflow:hidden;border-radius:var(--radius);background:var(--secondary);min-height:320px}.photo img{width:100%;height:100%;object-fit:cover}.copy p{line-height:1.75;color:var(--muted)}.dark .copy p{color:rgba(255,255,255,.7)}
.rows{border-top:1px solid rgba(255,255,255,.14)}.row{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid rgba(255,255,255,.14);font:500 .75rem/1.4 var(--mono)}.row small{color:var(--accent);text-align:right}.cards{display:grid;gap:1rem}.card{display:block;padding:1.25rem;border:1px solid rgba(0,0,0,.1);border-radius:var(--radius);background:var(--surface);text-decoration:none}.dark .card{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.12)}.card h3{font-size:1.2rem}.card p{color:var(--muted);line-height:1.55}.dark .card p{color:rgba(255,255,255,.6)}
.timeline{border-left:1px solid var(--accent)}.timeline-item{padding:0 0 1.6rem 1.25rem;position:relative}.timeline-item::before{content:'';position:absolute;left:-4px;top:.4rem;width:7px;height:7px;border-radius:50%;background:var(--accent)}.timeline-item h3{font-size:1.05rem}.timeline-item .meta{margin:.3rem 0;font:500 .68rem/1.4 var(--mono);color:var(--accent)}.timeline-item p{margin:.45rem 0 0;line-height:1.55;color:rgba(255,255,255,.62)}
.edu-grid{display:grid;gap:2rem}.tags{display:flex;flex-wrap:wrap;gap:.55rem}.tag{padding:.45rem .7rem;border:1px solid rgba(0,0,0,.16);border-radius:999px;font:500 .68rem/1 var(--mono)}
.video-grid{display:grid;grid-template-columns:1fr;gap:1rem}.video-card{aspect-ratio:9/16;border-radius:var(--radius);overflow:hidden;background:#111;position:relative}.video-card iframe,.video-card video{width:100%;height:100%;border:0;object-fit:cover}.schedule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.slot{padding:1rem;border-radius:var(--radius);background:var(--surface);border:1px solid rgba(0,0,0,.1)}.slot strong{display:block}.slot span{font:500 .72rem/1.4 var(--mono);color:var(--muted)}
.social-frame{min-height:420px;border-radius:var(--radius);overflow:hidden;background:rgba(255,255,255,.05)}.social-frame iframe{width:100%;min-height:520px;border:0}.contact-links{display:grid;gap:.65rem}.contact-links a{padding:.8rem 0;border-bottom:1px solid rgba(255,255,255,.14);text-decoration:none;font:500 .75rem/1.3 var(--mono)}
.hidden{display:none!important}footer{padding:1.5rem;text-align:center;background:#050f0c;color:rgba(255,255,255,.45);font:500 .62rem/1.5 var(--mono)}
@media(min-width:820px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.about-grid{grid-template-columns:minmax(320px,420px) 1fr;gap:5rem}.feature-grid{grid-template-columns:1fr 1fr;gap:4rem}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.edu-grid{grid-template-columns:1fr 1fr;gap:5rem}.video-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.schedule-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.contact-grid{grid-template-columns:1fr 1fr;gap:5rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.boot-spin,.ticker-track{animation:none!important}}
</style>
</head>
<body>
<div id="boot"><div class="boot-inner"><div class="boot-spin"></div><div class="boot-text">Carregando site</div></div></div>
<main id="app" aria-live="polite"></main>
<footer id="footer" class="hidden"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script src="/project-context.js"></script>
<script src="/project-data.js"></script>
<script src="/public-renderer.js"></script>
</body>
</html>
