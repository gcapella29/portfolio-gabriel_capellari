name: WebAppCap v2 CI

on:
  push:
    branches: [refactor/webappcap-core-v2]
    paths:
      - 'webappcap-v2/**'
      - '.github/workflows/webappcap-v2-ci.yml'
  pull_request:
    paths:
      - 'webappcap-v2/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webappcap-v2
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webappcap-v2/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
