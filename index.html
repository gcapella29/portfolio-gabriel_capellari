    color:var(--cream);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:1.4rem 1.4rem 2.2rem;
    overflow:hidden;
  }
  .hero-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(243,238,226,0.75);
  }
  .badge{
    border:1px solid rgba(243,238,226,0.4);
    border-radius:3px;
    padding:0.35rem 0.6rem;
    background:rgba(8,39,32,0.4);
    backdrop-filter:blur(2px);
  }
  .hero-main{margin-top:auto; padding-top:3rem;}
  .hero-name{
    font-size:clamp(2.6rem, 11vw, 5rem);
    line-height:0.96;
    font-weight:600;
  }
  .hero-name em{font-style:italic; font-weight:500; color:var(--gold-bright);}
  .hero-role{
    margin-top:0.9rem;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    letter-spacing:0.03em;
    color:rgba(243,238,226,0.88);
    display:flex;
    flex-wrap:wrap;
    gap:0.5rem 0;
  }
  .hero-role .sep{margin:0 0.55rem; color:var(--gold);}
  .hero-flags{
    margin-top:1.6rem;
    display:flex;
    gap:0.5rem;
    flex-wrap:wrap;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.04em;
    border:1px solid rgba(243,238,226,0.35);
    border-radius:999px;
    padding:0.3rem 0.7rem 0.32rem;
    color:rgba(243,238,226,0.9);
  }

  /* ---------- TICKER ---------- */
  .ticker-wrap{
    background:var(--gold);
    color:var(--felt-dark);
    overflow:hidden;
    white-space:nowrap;
    border-top:1px solid var(--felt-dark);
    border-bottom:1px solid var(--felt-dark);
  }
  .ticker{
    display:inline-flex;
    padding:0.55rem 0;
    animation:scroll 34s linear infinite;
  }
  .ticker span{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.75rem;
    font-weight:600;
    letter-spacing:0.03em;
    padding:0 1.4rem;
    text-transform:uppercase;
  }
  .ticker span::after{content:"◆"; margin-left:1.4rem; opacity:0.6; font-size:0.6rem; vertical-align:middle;}
  @keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .ticker{animation:none;}
    html{scroll-behavior:auto;}
  }

  /* ---------- SECTIONS ---------- */
  section{padding:4.2rem 1.4rem;}
  .section-head{margin-bottom:2rem;}
  .section-head h2{font-size:clamp(1.7rem,6vw,2.3rem); margin-top:0.4rem; font-weight:600;}

  /* ABOUT */
  .about{background:var(--paper);}
  .about-photo{
    border-radius:4px;
    overflow:hidden;
    margin-bottom:1.8rem;
    aspect-ratio:4/5;
    background:var(--felt);
  }
  .about-photo img{width:100%; height:100%; object-fit:cover; object-position:top;}
  .about p{font-size:1.02rem; line-height:1.65; color:#3a342c; max-width:60ch;}
  .about p + p{margin-top:1rem;}

  /* COVERAGE — live board */
  .coverage{background:var(--felt); color:var(--cream);}
  .coverage .eyebrow{color:var(--gold-bright);}
  .coverage .section-head h2{color:var(--cream);}
  .board{
    border-top:1px solid var(--felt-line);
  }
  .board-row{
    display:flex;
    justify-content:space-between;
    gap:1rem;
    padding:0.85rem 0;
    border-bottom:1px solid var(--felt-line);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
  }
  .board-row .ev{color:var(--cream); font-weight:500;}
  .board-row .yr{color:var(--gold-bright); white-space:nowrap; text-align:right;}

  /* PORTFOLIO */
  .portfolio{background:var(--paper);}
  .press-cards{display:grid; gap:0.9rem; grid-template-columns:1fr;}
  .press-card{
    border:1px solid #e2dbc8;
    border-radius:6px;
    padding:1.1rem 1.2rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    text-decoration:none;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .press-card:hover, .press-card:focus-visible{border-color:var(--gold); background:#fbf6e9;}
  .press-card .name{font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem;}
  .press-card .desc{font-size:0.85rem; color:var(--muted); margin-top:0.15rem;}
  .press-card .arrow{font-family:'IBM Plex Mono',monospace; font-size:1.1rem; color:var(--brick); flex-shrink:0;}

  /* EXPERIENCE — hand history log */
  .experience{background:var(--felt-dark); color:var(--cream);}
  .experience .eyebrow{color:var(--gold-bright);}
  .experience .section-head h2{color:var(--cream);}
  .log{border-top:1px solid var(--felt-line);}
  .log-entry{
    padding:1.1rem 0;
    border-bottom:1px solid var(--felt-line);
    display:flex;
    flex-direction:column;
    gap:0.2rem;
  }
  .log-entry .top-line{display:flex; justify-content:space-between; gap:1rem; align-items:baseline; flex-wrap:wrap;}
  .log-entry .role{font-family:'Fraunces',serif; font-size:1.08rem; font-weight:600;}
  .log-entry .yrs{font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--gold-bright); white-space:nowrap;}
  .log-entry .org{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:rgba(243,238,226,0.65); margin-top:0.15rem;}
  .log-entry .note{font-size:0.9rem; color:rgba(243,238,226,0.8); margin-top:0.35rem; max-width:58ch; line-height:1.5;}

  /* EDU + SKILLS */
  .edu{background:var(--paper);}
  .edu-grid{display:grid; gap:2.4rem; grid-template-columns:1fr;}
  .edu-item{border-left:2px solid var(--gold); padding-left:1rem;}
  .edu-item .deg{font-family:'Fraunces',serif; font-weight:600; font-size:1.05rem;}
  .edu-item .inst{font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--muted); margin-top:0.2rem;}
  .stack-title{font-family:'IBM Plex Mono',monospace; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:0.8rem;}
  .chipstack{display:flex; flex-wrap:wrap; gap:0.6rem;}
  .poker-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.74rem;
    font-weight:600;
    border-radius:999px;
    padding:0.42rem 0.85rem;
    border:2px dashed var(--gold);
    color:var(--ink);
    background:repeating-linear-gradient(135deg, var(--cream), var(--cream) 6px, #f8f0d8 6px, #f8f0d8 12px);
  }
  .poker-chip.high{border-color:var(--brick); border-style:solid;}

  /* CONTACT */
  .contact{
    background:var(--felt);
    color:var(--cream);
    text-align:left;
  }
  .contact .section-head h2{color:var(--cream);}
  .contact-photo{
    border-radius:4px;
    overflow:hidden;
    margin:1.6rem 0 2rem;
    aspect-ratio:16/10;
  }
  .contact-photo img{width:100%; height:100%; object-fit:cover;}
  .contact-links{display:flex; flex-direction:column; gap:0.8rem;}
  .contact-links a{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.95rem;
    text-decoration:none;
    border-bottom:1px solid var(--felt-line);
    padding-bottom:0.8rem;
    display:flex;
    justify-content:space-between;
  }
  .contact-links a span.lbl{color:var(--gold-bright); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em;}

  /* HIGHLIGHTS STRIP */
  .stats{
    background:var(--felt-dark);
    padding:2.6rem 1.4rem;
    display:grid;
    grid-template-columns:1fr;
    gap:1.8rem;
    border-bottom:1px solid var(--felt-line);
  }
  .stat{text-align:left;}
  .stat .num{font-family:'Fraunces',serif; font-weight:600; font-size:2.6rem; color:var(--gold-bright); line-height:1;}
  .stat .lbl{font-family:'IBM Plex Mono',monospace; font-size:0.74rem; color:rgba(243,238,226,0.75); margin-top:0.4rem; letter-spacing:0.02em; max-width:24ch;}
  footer{
    background:var(--felt-dark);
    color:rgba(243,238,226,0.5);
    text-align:center;
    padding:1.6rem 1.4rem;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.04em;
  }

  /* ---------- DESKTOP ---------- */
  @media (min-width:820px){
    section{padding:6rem 4rem;}
    .hero{padding:2rem 4rem 3rem;}
    .hero-main{max-width:900px;}
    .about-grid{display:grid; grid-template-columns:340px 1fr; gap:3.5rem; align-items:start;}
    .about-photo{margin-bottom:0;}
    .board{max-width:820px;}
    .press-cards{grid-template-columns:1fr 1fr;}
    .log{max-width:820px;}
    .log-entry .top-line{flex-wrap:nowrap;}
    .edu-grid{grid-template-columns:1fr 1fr; align-items:start;}
    .contact-grid{display:grid; grid-template-columns:1fr 1fr; gap:3rem; align-items:center;}
    .contact-photo{margin:0;}
    .stats{grid-template-columns:repeat(3,1fr); padding:3.2rem 4rem; gap:2.5rem;}
  }

  :focus-visible{outline:2px solid var(--gold-bright); outline-offset:2px;}

  /* ---------- MOTION ---------- */
  .reveal{opacity:0; transform:translateY(28px); transition:opacity 0.8s cubic-bezier(.16,.8,.3,1), transform 0.8s cubic-bezier(.16,.8,.3,1);}
  .reveal.in{opacity:1; transform:translateY(0);}
  .reveal-stagger > *{opacity:0; transform:translateY(18px); transition:opacity 0.6s ease, transform 0.6s ease;}
  .reveal-stagger.in > *{opacity:1; transform:translateY(0);}
</style>
</head>

  <!-- O restante da sua estrutura de conteúdo permanece intacto e otimizado -->
