<!DOCTYPE html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aprendendo Matemática | WebAppCap</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2542;--violet:#6956da;--soft:#efedff;--line:#e5e7f0;--muted:#6b7891;--bg:#f7f8fc;--green:#14856c}*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px 'DM Sans',sans-serif;color:var(--ink)}h1,h2,h3{font-family:Outfit;margin:0}h1{font-size:clamp(29px,3vw,42px)}h2{font-size:24px}p{line-height:1.65}button{font:inherit;cursor:pointer}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:white;border-right:1px solid var(--line);padding:28px 17px;display:flex;flex-direction:column;gap:30px}
.brand{display:flex;align-items:center;gap:12px;padding:0 7px}.mark{background:var(--violet);color:white;width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:27px;font-weight:700}.brand strong{font:800 18px/1.02 Outfit}.brand small{font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.nav{display:grid;gap:6px}.nav button{text-align:left;border:0;background:transparent;padding:14px;border-radius:11px;font-weight:700;color:var(--muted)}.nav button:hover,.nav button.active{background:var(--soft);color:var(--violet)}
.sidebar-foot{margin-top:auto;background:var(--soft);color:#5744c6;padding:15px;border-radius:15px;font-size:13px;line-height:1.6}
main{width:100%;max-width:1360px;margin:auto;padding:38px clamp(20px,5vw,65px) 80px}.top{display:flex;justify-content:space-between;margin-bottom:32px;gap:15px;font-size:12px;letter-spacing:.1em;font-weight:700;color:var(--muted)}.profile{letter-spacing:0;color:var(--violet);background:var(--soft);padding:8px 12px;border-radius:30px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--violet)}.muted{color:var(--muted)}.lead{font-size:16px;margin-top:7px}
.hero{background:linear-gradient(110deg,#5a4acb,#8d79ed);color:white;padding:34px;border-radius:24px;margin:24px 0 28px}.hero h2{font-size:30px;margin:10px 0}.hero p{color:#ede9ff;max-width:600px}.hero .eyebrow{color:#e3dcff}
.btn{border:0;border-radius:11px;background:var(--violet);padding:12px 19px;color:white;font-weight:700}.btn.white{background:white;color:#5645c2}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.ghost{background:var(--soft);color:var(--violet)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:22px 0}.card,.panel{border:1px solid var(--line);background:white;border-radius:19px;padding:22px}.card b{display:block;font:800 30px Outfit;margin-top:12px}.card small{color:var(--muted)}.panel{margin:21px 0}.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.module{background:white;border:1px solid var(--line);padding:20px;border-radius:18px;display:flex;flex-direction:column;gap:10px}.module h3{font-size:18px}.module p{font-size:13px;color:var(--muted);margin:0}.module .btn{margin-top:auto;align-self:flex-start}
.lesson{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);padding:17px;border-radius:13px;margin:10px 0;gap:20px}.lesson h3{font-size:17px}.lesson p{font-size:13px;margin:4px 0;color:var(--muted)}.badge{font-weight:700;font-size:12px;background:var(--soft);color:var(--violet);padding:6px 9px;border-radius:9px}
.progress{height:9px;background:#ebeaf4;border-radius:10px;margin:16px 0 30px;overflow:hidden}.progress div{height:100%;background:var(--violet)}
.option{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:15px;border:1.5px solid var(--line);border-radius:12px;background:white;margin:10px 0}.option:hover{border-color:#a89bf0}.option.chosen{border-color:var(--violet);background:#f6f4ff}.option.correct{border-color:#16a57d;background:#e9faf4}.option.wrong{border-color:#d97070;background:#fff0f0}.letter{background:var(--soft);border-radius:7px;padding:7px 10px;color:var(--violet);font-weight:700}
.feedback{padding:17px;border-radius:12px;margin:17px 0;background:#f0edff}.feedback.good{background:#e4f7ed;color:#176e53}.feedback.bad{background:#fff4df;color:#7b5c2b}.theory{background:#f5f3ff;padding:22px;border-radius:15px;line-height:1.9;margin:19px 0}.error{border-left:4px solid #d97070;padding:18px;background:white}.actions{display:flex;gap:10px;flex-wrap:wrap}.loading{padding:60px;text-align:center;color:var(--muted)}
@media(max-width:930px){.layout{grid-template-columns:80px 1fr}.sidebar{padding:20px 10px}.brand strong,.brand small,.sidebar-foot,.nav .label{display:none}.brand{padding:0;justify-content:center}.nav button{text-align:center}.modules{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.layout{display:block}.sidebar{position:sticky;top:0;z-index:2;padding:9px;flex-direction:row;gap:10px;align-items:center;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{padding:9px;font-size:15px}.mark{width:36px;height:36px}.modules,.cards{grid-template-columns:1fr}main{padding:20px 15px}.top{margin-bottom:21px}.hero{padding:24px}.hero h2{font-size:25px}.lesson{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="layout"><aside class="sidebar"><div class="brand"><div class="mark">∑</div><div><strong>aprendendo<br>matemática</strong><br><small>POR WEBAPPCAP</small></div></div><nav class="nav">
<button data-page="home" class="active" onclick="navigate('home')">⌂ <span class="label">Início</span></button>
<button data-page="trilha" onclick="navigate('trilha')">▦ <span class="label">Minha trilha</span></button>
<button data-page="diagnostico" onclick="navigate('diagnostico')">✎ <span class="label">Diagnóstico</span></button>
<button data-page="aulas" onclick="navigate('aulas')">◫ <span class="label">Aulas</span></button>
<button data-page="progresso" onclick="navigate('progresso')">◷ <span class="label">Progresso</span></button>
</nav><div class="sidebar-foot"><strong>Um passo de cada vez.</strong><br>Aprender matemática é construir confiança, exercício por exercício.</div></aside>
<main><div class="top"><span>PLATAFORMA DE APRENDIZAGEM · V0.1</span><span class="profile">★ Meu perfil</span></div><section id="content"><div class="loading">Carregando a jornada...</div></section></main></div>
<script>
'use strict';
const S={data:null,page:'home',quiz:null,lesson:null,questions:[],index:0,selected:null,result:null,correct:0};
const root=document.getElementById('content');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(name,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(Error('Abra a URL publicada no Google Apps Script.'));google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e.message||e)))[name](...args)})}
function loading(){root.innerHTML='<div class="loading">Preparando sua experiência...</div>'}
function error(e){root.innerHTML='<div class="error"><h2>Não foi possível carregar</h2><p>'+esc(e.message)+'</p><p>Verifique se executou configurarProjeto() no Apps Script.</p><button class="btn" onclick="start()">Tentar novamente</button></div>'}
function header(k,t,d){return '<div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="lead muted">'+d+'</p>'}
function navigate(p){S.page=p;S.quiz=null;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
async function start(){loading();try{S.data=await api('getInitialData');render()}catch(e){error(e)}}
function render(){if(!S.data)return;root.innerHTML=({home,trilha,diagnostico,aulas,progresso}[S.page]||home)()}
function home(){const d=S.data,n=d.progress.filter(x=>x.status==='concluida').length;return header('BEM-VINDO','A matemática começa aqui','No seu ritmo, do fundamento ao avançado.')+
'<div class="hero"><div class="eyebrow">SEU PRÓXIMO PASSO</div><h2>'+(d.diagnostic.completed?'Continue sua jornada':'Descubra seu ponto de partida')+'</h2><p>Aulas claras, prática progressiva e acompanhamento dos seus resultados em uma experiência feita para você.</p><button class="btn white" onclick="navigate(\''+(d.diagnostic.completed?'aulas':'diagnostico')+'\')">'+(d.diagnostic.completed?'Explorar aulas':'Fazer diagnóstico')+' →</button></div>'+
'<div class="cards"><div class="card"><small>Questões respondidas</small><b>'+d.answeredCount+'</b></div><div class="card"><small>Aulas concluídas</small><b>'+n+'</b></div><div class="card"><small>Diagnóstico</small><b>'+(d.diagnostic.completed?'Concluído':'Pendente')+'</b></div></div>'+
'<h2>Seu percurso</h2><div class="modules">'+d.modules.slice(0,3).map(m=>moduleCard(m)).join('')+'</div>'}
function moduleCard(m){const lessons=S.data.lessons.filter(x=>x.modulo_id===m.modulo_id);return '<div class="module"><span class="badge">MÓDULO '+esc(m.ordem)+'</span><h3>'+esc(m.titulo)+'</h3><p>'+esc(m.descricao)+'</p><p>'+lessons.length+' aula(s) cadastrada(s)</p><button class="btn ghost" onclick="navigate(\'aulas\')">Ver aulas →</button></div>'}
function trilha(){return header('CURRÍCULO','Minha trilha','Seis grandes áreas, do básico até tópicos avançados.')+'<div class="modules">'+S.data.modules.map(moduleCard).join('')+'</div>'}
function diagnostico(){if(S.quiz==='diagnostico')return quiz();return header('PONTO DE PARTIDA','Diagnóstico inicial','Seis questões autorais para reconhecer seus conhecimentos atuais.')+'<div class="panel"><span class="badge">VERSÃO INICIAL · NÃO ADAPTATIVO</span><h2 style="margin-top:15px">Descubra o que já sabe</h2><p>Operações, frações, porcentagem e uma equação. Sem cronômetro e sem pressão.</p>'+(S.data.diagnostic.completed?'<p>Diagnóstico registrado: '+S.data.diagnostic.correct+' de 6 acertos na última sequência.</p>':'')+'<button class="btn" onclick="begin(\'diagnostico\')">Iniciar diagnóstico →</button></div>'}
function aulas(){if(S.quiz==='pratica')return quiz();if(S.lesson)return lessonView();return header('APRENDIZAGEM','Aulas','Explicações simples, exemplos e exercícios comentados.')+'<div class="panel">'+S.data.lessons.map(a=>'<div class="lesson"><div><h3>'+esc(a.titulo)+'</h3><p>'+esc(a.objetivo)+'</p><span class="badge">'+esc(a.status==='disponivel'?'Disponível':'Em breve')+'</span></div><button class="btn" '+(a.status!=='disponivel'?'disabled':'')+' onclick="openLesson(\''+esc(a.aula_id)+'\')">Estudar →</button></div>').join('')+'</div>'}
function openLesson(id){S.lesson=S.data.lessons.find(x=>x.aula_id===id);render()}
function lessonView(){const a=S.lesson;return header('AULA INTERATIVA',esc(a.titulo),esc(a.objetivo))+'<div class="panel"><h2>Vamos entender</h2><div class="theory">'+esc(a.teoria)+'</div><p>Leia a explicação e pratique. Cada resposta terá correção comentada.</p><div class="actions"><button class="btn" onclick="begin(\'pratica\',\''+esc(a.aula_id)+'\')">Praticar exercícios →</button><button class="btn ghost" onclick="markLesson(\''+esc(a.aula_id)+'\')">Marcar como estudada</button><button class="btn ghost" onclick="S.lesson=null;render()">Voltar</button></div></div>'}
async function markLesson(id){loading();try{await api('completeLesson',id);S.data=await api('getInitialData');S.lesson=null;render()}catch(e){error(e)}}
async function begin(type,id){loading();try{S.questions=await api('getQuestions',type,id||'');if(!S.questions.length)throw Error('Ainda não há questões nesta atividade.');S.quiz=type;S.index=0;S.selected=null;S.result=null;S.correct=0;render()}catch(e){S.quiz=null;error(e)}}
function quiz(){const q=S.questions[S.index];if(!q)return endQuiz();return header(S.quiz==='diagnostico'?'DIAGNÓSTICO':'EXERCÍCIOS','Questão '+(S.index+1),'Nível '+esc(q.nivel)+' · '+S.questions.length+' questões nesta atividade')+'<div class="progress"><div style="width:'+((S.index+1)/S.questions.length*100)+'%"></div></div><div class="panel"><h2>'+esc(q.enunciado)+'</h2><div style="margin:24px 0">'+q.alternativas.map((v,i)=>'<button class="option '+(S.selected===i?'chosen ':'')+(S.result?(i===S.result.correctIndex?'correct':S.selected===i?'wrong':''):'')+'" '+(S.result?'disabled':'')+' onclick="select('+i+')"><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(v)+'</button>').join('')+'</div>'+(S.result?'<div class="feedback '+(S.result.correct?'good':'bad')+'"><strong>'+(S.result.correct?'Resposta correta!':'Vamos aprender com este erro.')+'</strong><p>'+esc(S.result.explanation)+'</p></div><button class="btn" onclick="next()">'+(S.index===S.questions.length-1?'Finalizar':'Próxima questão')+' →</button>':'<button class="btn" '+(S.selected===null?'disabled':'')+' onclick="submit()">Verificar resposta</button>')+'</div><p class="muted">Questões originais de demonstração. Questões oficiais serão incluídas apenas com fonte e gabarito verificados.</p>'}
function select(i){if(S.result)return;S.selected=i;render()}
async function submit(){if(S.selected===null||S.result)return;loading();try{S.result=await api('submitAnswer',S.questions[S.index].id,S.selected);if(S.result.correct)S.correct++;render()}catch(e){error(e)}}
function next(){S.index++;S.selected=null;S.result=null;render()}
function endQuiz(){return header('ATIVIDADE CONCLUÍDA','Muito bem por praticar!','Toda tentativa é uma oportunidade de aprender.')+'<div class="panel"><h2>'+S.correct+' acertos de '+S.questions.length+'</h2><p>Suas respostas foram registradas no Google Sheets.</p><button class="btn" onclick="finish()">Voltar ao painel →</button></div>'}
async function finish(){S.quiz=null;S.lesson=null;S.page='home';loading();try{S.data=await api('getInitialData');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='home'));render()}catch(e){error(e)}}
function progresso(){const d=S.data,p=d.progress.filter(x=>x.status==='concluida');return header('ACOMPANHAMENTO','Meu progresso','Seus estudos são registrados na planilha do projeto.')+'<div class="cards"><div class="card"><small>Respostas</small><b>'+d.answeredCount+'</b></div><div class="card"><small>Aulas concluídas</small><b>'+p.length+'</b></div><div class="card"><small>Diagnóstico</small><b>'+(d.diagnostic.completed?'Feito':'Pendente')+'</b></div></div><div class="panel"><h2>Aulas estudadas</h2>'+(p.length?p.map(x=>'<p>✓ '+esc(d.lessons.find(l=>l.aula_id===x.aula_id)?.titulo||x.aula_id)+'</p>').join(''):'<p class="muted">Nenhuma aula marcada como concluída ainda.</p>')+'</div>'}
start();
</script></body></html>
