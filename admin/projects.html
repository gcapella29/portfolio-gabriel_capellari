<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Projetos — WebAppCap</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/ux.css"><style>
:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--danger:#a83c2e;--ok:#277a52;--warn:#9b6c16;--shadow:0 18px 55px rgba(8,39,32,.10)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.hidden{display:none!important}h1,h2,h3{font-family:Fraunces,serif}.shell{max-width:1200px;margin:auto;padding:2rem 1rem 5rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.4rem}.top h1{font-size:clamp(2.5rem,6vw,4.5rem);margin:.15rem 0}.top p{color:var(--muted);max-width:720px;line-height:1.55}.kicker{font:600 .64rem "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.06em}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:.72rem .92rem;font:600 .66rem "IBM Plex Mono",monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:var(--dark)}.dark{background:var(--dark);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger-btn{background:#fff;border:1px solid #e4c0ba;color:var(--danger)}.toolbar{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:.7rem;align-items:center;margin-bottom:1rem}.tabs{display:flex;gap:.4rem}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.48rem .72rem;font:600 .63rem "IBM Plex Mono",monospace;cursor:pointer}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}.search{width:100%;padding:.75rem .9rem;border:1px solid var(--line);border-radius:999px;background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1rem}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.8rem}.stat .k{font:600 .58rem "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--muted)}.stat .v{font:700 1.45rem Fraunces,serif;margin-top:.25rem}.projects{display:grid;gap:.8rem}.project{background:#fff;border:1px solid var(--line);border-radius:17px;padding:1rem 1.05rem;box-shadow:var(--shadow)}.project.archived{background:#f3f0e8;opacity:.88}.project-main{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}.meta h3{margin:0 0 .25rem;font-size:1.3rem}.slug{font:500 .66rem "IBM Plex Mono",monospace;color:var(--muted)}.badges{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}.badge{padding:.3rem .48rem;border-radius:999px;background:#f2efe6;font-size:.66rem;color:var(--muted)}.badge.ok{background:#e7f4ed;color:var(--ok)}.badge.warn{background:#fff2d4;color:#80550b}.badge.protected{background:#e8f1ec;color:#245f46}.badge.archived{background:#fff0d2;color:#7d5810}.project-actions{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}.secondary{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.8rem;padding-top:.8rem;border-top:1px solid #eee}.life{position:relative}.life summary{list-style:none}.life summary::-webkit-details-marker{display:none}.life-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 55px rgba(8,39,32,.16);padding:.4rem;min-width:190px;display:grid;gap:.2rem}.life-panel button{border:0;background:transparent;text-align:left;padding:.6rem .65rem;border-radius:8px;font:600 .63rem "IBM Plex Mono",monospace;cursor:pointer}.life-panel button:hover{background:#f2efe6}.life-panel .danger{color:var(--danger)}.empty{background:#fff;border:1px dashed var(--line);border-radius:17px;padding:2rem;text-align:center;color:var(--muted)}.modal-back{position:fixed;inset:0;background:rgba(8,39,32,.63);backdrop-filter:blur(5px);display:grid;place-items:center;padding:1rem;z-index:25000}.modal{width:min(560px,100%);background:var(--paper);border-radius:20px;border:1px solid var(--line);padding:1.25rem;box-shadow:0 35px 100px rgba(0,0,0,.28)}.modal h2{font-size:2rem;margin:.1rem 0 .35rem}.field{display:grid;gap:.38rem;margin-top:.8rem}.field label{font:600 .61rem "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--muted)}.field input{width:100%;padding:.8rem .85rem;border:1px solid var(--line);border-radius:10px;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}@media(max-width:850px){.toolbar{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.top,.project-main{flex-direction:column}.project-actions{width:100%}.project-actions .btn{flex:1}}@media(max-width:520px){.stats{grid-template-columns:1fr}.secondary .btn{flex:1}}
</style></head><body><main class="shell hidden" id="app"><header class="top"><div><div class="kicker">WEBAPPCAP · CLIENTES</div><h1>Projetos</h1><p>Crie clientes, acompanhe publicação e domínio e administre todo o ciclo de vida sem sair do CMS.</p></div><div class="actions"><a class="btn gold hidden" id="newProjectButton" href="/admin/new-project.html">+ Novo projeto</a><button class="btn ghost" id="logoutButton" type="button">Sair</button></div></header>
<section class="stats"><article class="stat"><div class="k">Ativos</div><div class="v" id="statActive">0</div></article><article class="stat"><div class="k">Publicados</div><div class="v" id="statPublished">0</div></article><article class="stat"><div class="k">Domínio ativo</div><div class="v" id="statDomains">0</div></article><article class="stat"><div class="k">Arquivados</div><div class="v" id="statArchived">0</div></article></section>
<div class="toolbar"><div class="tabs"><button class="tab active" data-filter="active">Ativos</button><button class="tab" data-filter="archived">Arquivados</button><button class="tab" data-filter="all">Todos</button></div><input class="search" id="search" placeholder="Buscar por nome, slug ou tipo"><div class="kicker" id="resultCount"></div></div><section class="projects" id="projects"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="../project-context.js"></script><script src="/admin/ux.js"></script><script>
(async()=>{const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);let user=null,allProjects=[],filter='active',query='',isPlatformOwner=false;const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const toast=(m,type='info')=>window.WebAppCapUX?.toast(m,{type});function publicUrl(p){const active=String(p.domain_status||'').toLowerCase()==='active';if(active&&p.custom_domain)return`https://${p.custom_domain}/`;if(active&&p.subdomain)return`https://${p.subdomain}.webappcap.com.br/`;return p.slug===cfg.projectSlug?'/':`/p/${encodeURIComponent(p.slug)}`}function statusBadge(p){if(p.archived_at)return'<span class="badge archived">ARQUIVADO</span>';return p.is_published?'<span class="badge ok">PUBLICADO</span>':'<span class="badge warn">RASCUNHO</span>'}function domainBadge(p){const st=String(p.domain_status||'').toLowerCase();if(st==='active')return'<span class="badge ok">DOMÍNIO ATIVO</span>';if(st==='pending')return'<span class="badge warn">DOMÍNIO PENDENTE</span>';return'<span class="badge">SEM DOMÍNIO</span>'}function stats(){$('statActive').textContent=allProjects.filter(p=>!p.archived_at).length;$('statPublished').textContent=allProjects.filter(p=>!p.archived_at&&p.is_published).length;$('statDomains').textContent=allProjects.filter(p=>!p.archived_at&&String(p.domain_status||'').toLowerCase()==='active').length;$('statArchived').textContent=allProjects.filter(p=>p.archived_at).length}function filtered(){return allProjects.filter(p=>filter==='active'?!p.archived_at:filter==='archived'?!!p.archived_at:true).filter(p=>{if(!query)return true;const hay=`${p.name} ${p.slug} ${p.site_type} ${p.role}`.toLowerCase();return hay.includes(query)})}function render(){stats();document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const list=filtered();$('resultCount').textContent=`${list.length} projeto(s)`;if(!list.length){$('projects').innerHTML='<div class="empty">Nenhum projeto encontrado.</div>';return}$('projects').innerHTML=list.map(p=>{const manager=['owner','admin'].includes(String(p.role||'').toLowerCase()),owner=String(p.role||'').toLowerCase()==='owner';return`<article class="project ${p.archived_at?'archived':''}"><div class="project-main"><div class="meta"><h3>${esc(p.name)}</h3><div class="slug">${esc(p.slug)}</div><div class="badges"><span class="badge">${esc(p.site_type||'portfolio')}</span><span class="badge">${esc(p.role||'viewer')}</span>${statusBadge(p)}${domainBadge(p)}${p.is_system?'<span class="badge protected">PROTEGIDO</span>':''}</div></div><div class="project-actions">${!p.archived_at?`<button class="btn gold" data-open="${esc(p.slug)}">Gerenciar</button>`:''}${manager?`<a class="btn ghost" href="/admin/team.html?project=${encodeURIComponent(p.slug)}">Equipe</a>`:''}${manager?`<details class="life"><summary class="btn ghost">•••</summary><div class="life-panel">${p.archived_at?`<button data-restore="${p.id}">Restaurar projeto</button>${owner&&!p.is_system?`<button class="danger" data-delete="${p.id}">Excluir permanentemente</button>`:''}`:`<button data-archive="${p.id}">Arquivar projeto</button>`}</div></details>`:''}</div></div>${!p.archived_at?`<div class="secondary"><a class="btn ghost" href="/preview.html?preview=draft&project=${encodeURIComponent(p.slug)}" target="_blank">Preview ↗</a>${manager?`<a class="btn ghost" href="/admin/publishing.html?project=${encodeURIComponent(p.slug)}">Publicação</a><a class="btn ghost" href="/admin/domains.html?project=${encodeURIComponent(p.slug)}">Domínio</a>`:''}${p.is_published?`<a class="btn ghost" href="${publicUrl(p)}" target="_blank">Site ↗</a>`:''}</div>`:''}</article>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{window.VITRINE_PROJECT_CONTEXT?.set?.(b.dataset.open);location.href=`/admin/dashboard.html?project=${encodeURIComponent(b.dataset.open)}`});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>archiveProject(b.dataset.archive));document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreProject(b.dataset.restore));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProject(b.dataset.delete))}async function load(){const q=await sb.rpc('webappcap_my_projects',{include_archived:true});if(q.error)throw q.error;allProjects=q.data||[];const defaultProject=allProjects.find(p=>p.slug===cfg.projectSlug);isPlatformOwner=defaultProject?.role==='owner';$('newProjectButton').classList.toggle('hidden',!isPlatformOwner);render()}async function lifecycle(action,p,confirmation=''){const r=await sb.functions.invoke('project-lifecycle',{body:{action,project_id:p.id,confirmation}});if(r.error)throw r.error;if(r.data?.error)throw new Error(r.data.error)}async function archiveProject(id){const p=allProjects.find(x=>x.id===id);if(!p)return;const ok=await window.WebAppCapUX.confirm({title:'Arquivar projeto?',message:`"${p.name}" ficará indisponível publicamente e sairá dos ativos.`,confirmText:'Arquivar',danger:true});if(!ok)return;try{await lifecycle('archive',p);toast('Projeto arquivado ✓','success');await load()}catch(e){toast(window.WebAppCapUX.friendlyError(e),'error')}}async function restoreProject(id){const p=allProjects.find(x=>x.id===id);if(!p)return;try{await lifecycle('restore',p);toast('Projeto restaurado ✓','success');await load()}catch(e){toast(window.WebAppCapUX.friendlyError(e),'error')}}async function deleteProject(id){const p=allProjects.find(x=>x.id===id);if(!p||p.role!=='owner'||p.is_system)return;const wrap=document.createElement('div');wrap.className='modal-back';wrap.innerHTML=`<div class="modal"><div class="kicker" style="color:var(--danger)">EXCLUSÃO PERMANENTE</div><h2>Excluir ${esc(p.name)}?</h2><p>Conteúdo, rascunhos, histórico, membros, plano e mídia serão removidos. Esta ação não pode ser desfeita.</p><div class="field"><label>Digite exatamente ${esc(p.slug)}</label><input id="deleteConfirmInput" autocomplete="off"></div><div class="modal-actions"><button class="btn ghost" data-cancel>Cancelar</button><button class="btn danger-btn" data-confirm disabled>Excluir permanentemente</button></div></div>`;document.body.appendChild(wrap);const input=wrap.querySelector('#deleteConfirmInput'),confirm=wrap.querySelector('[data-confirm]');input.oninput=()=>confirm.disabled=input.value!==p.slug;wrap.querySelector('[data-cancel]').onclick=()=>wrap.remove();confirm.onclick=async()=>{window.WebAppCapUX.setButtonBusy(confirm,true,{busyText:'Excluindo…'});try{await lifecycle('delete',p,input.value);wrap.remove();toast('Projeto excluído permanentemente ✓','success');await load()}catch(e){toast(window.WebAppCapUX.friendlyError(e),'error');window.WebAppCapUX.setButtonBusy(confirm,false)}}}$('search').oninput=()=>{query=$('search').value.trim().toLowerCase();render()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$('logoutButton').onclick=async()=>{await sb.auth.signOut();window.VITRINE_PROJECT_CONTEXT?.clear?.();location.replace('/admin/')};const session=(await sb.auth.getSession()).data.session;if(!session){location.replace('/admin/?next='+encodeURIComponent('/admin/projects.html'));return}user=session.user;$('app').classList.remove('hidden');try{await load()}catch(e){console.error(e);toast(window.WebAppCapUX.friendlyError(e),'error')}})();
</script></body></html>
