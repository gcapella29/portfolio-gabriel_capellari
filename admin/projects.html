<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Projetos — WebAppCap</title>
<!-- WEBAPPCAP_PROJECTS_BUILD_9413_CREATE_OWNER -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/ux.css">
<style>
:root{--dark:#082720;--felt:#0e3b2e;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--danger:#a83c2e;--shadow:0 18px 55px rgba(8,39,32,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.hidden{display:none!important}
h1,h2,h3{font-family:Fraunces,serif}.shell{max-width:1180px;margin:auto;padding:2rem 1rem 5rem}
.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.4rem}.top h1{font-size:clamp(2.5rem,6vw,4.5rem);margin:.15rem 0}.top p{color:var(--muted);max-width:680px;line-height:1.55}
.kicker{font:600 .64rem "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.06em}.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:.74rem .95rem;font:600 .67rem "IBM Plex Mono",monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.gold{background:var(--gold);color:var(--dark)}.dark{background:var(--dark);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger-btn{background:#fff;border:1px solid #e4c0ba;color:var(--danger)}
.toolbar{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin-bottom:1rem}.tabs{display:flex;gap:.45rem}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.48rem .72rem;font:600 .64rem "IBM Plex Mono",monospace;cursor:pointer}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.projects{display:grid;gap:.8rem}.project{background:#fff;border:1px solid var(--line);border-radius:17px;padding:1rem 1.05rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;box-shadow:var(--shadow)}
.project.archived{background:#f3f0e8;opacity:.85}.meta h3{margin:0 0 .28rem;font-size:1.25rem}.slug{font:500 .66rem "IBM Plex Mono",monospace;color:var(--muted)}.badges{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem}.badge{padding:.3rem .48rem;border-radius:999px;background:#f2efe6;font-size:.68rem;color:var(--muted)}.badge.protected{background:#e8f1ec;color:#245f46}.badge.archived{background:#fff0d2;color:#7d5810}
.project-actions{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}.empty{background:#fff;border:1px dashed var(--line);border-radius:17px;padding:2rem;text-align:center;color:var(--muted)}
.life{position:relative}.life summary{list-style:none}.life summary::-webkit-details-marker{display:none}.life-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 55px rgba(8,39,32,.16);padding:.4rem;min-width:185px;display:grid;gap:.2rem}.life-panel button{border:0;background:transparent;text-align:left;padding:.6rem .65rem;border-radius:8px;font:600 .63rem "IBM Plex Mono",monospace;cursor:pointer}.life-panel button:hover{background:#f2efe6}.life-panel .danger{color:var(--danger)}
.modal-back{position:fixed;inset:0;background:rgba(8,39,32,.63);backdrop-filter:blur(5px);display:grid;place-items:center;padding:1rem;z-index:25000}.modal{width:min(560px,100%);max-height:calc(100vh - 2rem);overflow:auto;background:var(--paper);border-radius:20px;border:1px solid var(--line);padding:1.25rem;box-shadow:0 35px 100px rgba(0,0,0,.28)}.modal h2{font-size:2rem;margin:.1rem 0 .35rem}.modal p{color:var(--muted);font-size:.8rem;line-height:1.5}.form{display:grid;gap:.85rem;margin-top:1rem}.field{display:grid;gap:.38rem}.field label{font:600 .61rem "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--muted)}.field input,.field select{width:100%;padding:.8rem .85rem;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
.version{position:fixed;left:10px;bottom:8px;font:500 .52rem "IBM Plex Mono",monospace;color:rgba(114,128,120,.55)}
@media(max-width:760px){.top,.project,.toolbar{flex-direction:column;align-items:stretch}.project-actions .btn{flex:1}.toolbar .actions{width:100%}.toolbar .actions .btn{flex:1}.tabs{overflow:auto}.life-panel{left:0;right:auto}.modal-actions{flex-direction:column-reverse}.modal-actions .btn{width:100%}}
</style>
</head>
<body>
<main class="shell hidden" id="app">
<header class="top">
  <div><div class="kicker">WEBAPPCAP · GESTÃO</div><h1>Projetos</h1><p>Crie, organize e gerencie todos os sites em um único lugar. Projetos arquivados podem ser restaurados ou excluídos definitivamente.</p></div>
  <div class="actions"><a class="btn ghost" href="/admin/">← Painel</a></div>
</header>

<div class="toolbar">
  <div class="tabs">
    <button class="tab active" data-filter="active">Ativos <span id="activeCount"></span></button>
    <button class="tab" data-filter="archived">Arquivados <span id="archivedCount"></span></button>
  </div>
  <div class="actions"><button class="btn gold hidden" id="newProjectButton">+ Novo projeto</button></div>
</div>

<section class="projects" id="projects"></section>
</main>

<div class="modal-back hidden" id="newProjectModal">
  <div class="modal">
    <div class="kicker">NOVO PROJETO</div>
    <h2>Criar projeto</h2>
    <p>O projeto nasce como rascunho, não publicado, no plano Pro em implantação.</p>
    <form class="form" id="createForm">
      <div class="field"><label>Nome do projeto</label><input id="projectName" placeholder="Mariana Personal Trainer" required></div>
      <div class="field"><label>Slug</label><input id="projectSlug" placeholder="mariana-personal-trainer" required pattern="[a-z0-9-]+"></div>
      <div class="field"><label>Tipo</label><select id="projectType"><option value="portfolio">Portfólio profissional</option><option value="personal_trainer">Personal trainer</option><option value="language_teacher">Professor de idiomas</option><option value="local_business">Comércio local</option><option value="journalist">Jornalista</option><option value="other">Outro</option></select></div>
      <div class="modal-actions"><button class="btn ghost" type="button" data-close-create>Cancelar</button><button class="btn gold" id="createButton">Criar projeto</button></div>
    </form>
  </div>
</div>

<div class="version">Projetos UI · 9.4.1.3c</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../project-context.js"></script>
<script src="/admin/ux.js"></script>
<script>
(async()=>{
 const cfg=window.VITRINE_SUPABASE;
 const sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});
 const $=id=>document.getElementById(id);
 let user=null,allProjects=[],filter='active',isPlatformOwner=false;

 const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
 const slugify=v=>v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');

 function toast(m,type='info'){window.WebAppCapUX?.toast(m,{type})}
 function counts(){
   $('activeCount').textContent=`(${allProjects.filter(p=>!p.archived_at).length})`;
   $('archivedCount').textContent=`(${allProjects.filter(p=>p.archived_at).length})`;
 }
 function publicUrl(p){
   if(p.custom_domain)return `https://${p.custom_domain}/`;
   if(p.subdomain)return `https://${p.subdomain}.webappcap.com.br/`;
   return p.slug===cfg.projectSlug?'/':`/p/${encodeURIComponent(p.slug)}`;
 }
 function render(){
   counts();
   document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
   const list=allProjects.filter(p=>filter==='archived'?!!p.archived_at:!p.archived_at);
   if(!list.length){
     $('projects').innerHTML=`<div class="empty">${filter==='archived'?'Nenhum projeto arquivado.':'Nenhum projeto ativo.'}</div>`;
     return;
   }
   $('projects').innerHTML=list.map(p=>`
   <article class="project ${p.archived_at?'archived':''}">
    <div class="meta">
      <h3>${esc(p.name)}</h3>
      <div class="slug">${esc(p.slug)}</div>
      <div class="badges">
        <span class="badge">${esc(p.site_type||'portfolio')}</span>
        <span class="badge">${esc(p.role)}</span>
        ${p.is_system?'<span class="badge protected">PROTEGIDO</span>':''}
        ${p.archived_at?'<span class="badge archived">ARQUIVADO</span>':''}
      </div>
    </div>
    <div class="project-actions">
      ${!p.archived_at?`<button class="btn gold" data-open="${esc(p.slug)}">Gerenciar</button>`:''}
      ${!p.archived_at?`<a class="btn ghost" href="/preview.html?preview=draft&project=${encodeURIComponent(p.slug)}" target="_blank">Preview</a>`:''}
      ${!p.archived_at&&p.is_published?`<a class="btn ghost" href="${publicUrl(p)}" target="_blank">Site</a>`:''}
      ${p.role==='owner'&&!p.is_system?`
      <details class="life"><summary class="btn ghost">•••</summary><div class="life-panel">
       ${p.archived_at
        ? `<button data-restore="${p.id}">Restaurar projeto</button><button class="danger" data-delete="${p.id}">Excluir permanentemente</button>`
        : `<button data-archive="${p.id}">Arquivar projeto</button>`}
      </div></details>`:''}
    </div>
   </article>`).join('');

   document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
     window.VITRINE_PROJECT_CONTEXT?.set?.(b.dataset.open);
     location.href=`/admin/dashboard.html?project=${encodeURIComponent(b.dataset.open)}`;
   });
   document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=()=>archiveProject(b.dataset.archive));
   document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restoreProject(b.dataset.restore));
   document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProject(b.dataset.delete));
 }

 async function load(){
   const q=await sb.rpc('webappcap_my_projects',{include_archived:true});
   if(q.error)throw q.error;
   allProjects=q.data||[];
   const defaultProject=allProjects.find(p=>p.slug===cfg.projectSlug);
   isPlatformOwner=defaultProject?.role==='owner';
   $('newProjectButton').classList.toggle('hidden',!isPlatformOwner);
   render();
 }

 async function lifecycle(action,p,confirmation=''){
   const r=await sb.functions.invoke('project-lifecycle',{body:{action,project_id:p.id,confirmation}});
   if(r.error)throw r.error;
   if(r.data?.error)throw new Error(r.data.error);
 }

 async function archiveProject(id){
   const p=allProjects.find(x=>x.id===id);if(!p)return;
   const ok=await window.WebAppCapUX.confirm({title:'Arquivar projeto?',message:`"${p.name}" sairá da lista de ativos e ficará indisponível publicamente. Você poderá restaurá-lo depois.`,confirmText:'Arquivar',danger:true});
   if(!ok)return;
   try{await lifecycle('archive',p);toast('Projeto arquivado ✓','success');await load()}catch(e){toast(window.WebAppCapUX.friendlyError(e),'error')}
 }
 async function restoreProject(id){
   const p=allProjects.find(x=>x.id===id);if(!p)return;
   try{await lifecycle('restore',p);toast('Projeto restaurado ✓','success');await load()}catch(e){toast(window.WebAppCapUX.friendlyError(e),'error')}
 }
 async function deleteProject(id){
   const p=allProjects.find(x=>x.id===id);if(!p)return;
   const wrap=document.createElement('div');
   wrap.className='modal-back';
   wrap.innerHTML=`<div class="modal"><div class="kicker" style="color:var(--danger)">EXCLUSÃO PERMANENTE</div><h2>Excluir ${esc(p.name)}?</h2><p>Conteúdo, rascunhos, histórico, membros, plano comercial e mídia serão removidos. Esta ação não pode ser desfeita.</p><div class="field"><label>Digite exatamente ${esc(p.slug)}</label><input id="deleteConfirmInput" autocomplete="off"></div><div class="modal-actions"><button class="btn ghost" data-cancel>Cancelar</button><button class="btn danger-btn" data-confirm disabled>Excluir permanentemente</button></div></div>`;
   document.body.appendChild(wrap);
   const input=wrap.querySelector('#deleteConfirmInput'),confirm=wrap.querySelector('[data-confirm]');
   input.oninput=()=>confirm.disabled=input.value!==p.slug;
   wrap.querySelector('[data-cancel]').onclick=()=>wrap.remove();
   confirm.onclick=async()=>{
     window.WebAppCapUX.setButtonBusy(confirm,true,{busyText:'Excluindo…'});
     try{await lifecycle('delete',p,input.value);wrap.remove();toast('Projeto excluído permanentemente ✓','success');await load()}
     catch(e){toast(window.WebAppCapUX.friendlyError(e),'error');window.WebAppCapUX.setButtonBusy(confirm,false)}
   };
 }

 function openCreate(){
   $('createForm').reset();$('projectSlug').dataset.edited='';
   $('newProjectModal').classList.remove('hidden');$('projectName').focus();
 }
 function closeCreate(){$('newProjectModal').classList.add('hidden')}
 $('newProjectButton').onclick=openCreate;
 document.querySelectorAll('[data-close-create]').forEach(b=>b.onclick=closeCreate);
 $('newProjectModal').onclick=e=>{if(e.target===$('newProjectModal'))closeCreate()};
 $('projectName').oninput=()=>{if(!$('projectSlug').dataset.edited)$('projectSlug').value=slugify($('projectName').value)};
 $('projectSlug').oninput=()=>{$('projectSlug').dataset.edited='1';$('projectSlug').value=slugify($('projectSlug').value)};

 $('createForm').onsubmit=async e=>{
   e.preventDefault();
   if(!isPlatformOwner){toast('Sua conta não pode criar projetos.','error');return}
   const name=$('projectName').value.trim();
   const slug=$('projectSlug').value.trim();
   const site_type=$('projectType').value;
   if(!name||!slug)return;

   const btn=$('createButton');
   window.WebAppCapUX.setButtonBusy(btn,true,{busyText:'Criando…'});

   try{
     const result=await sb.functions.invoke('create-project',{
       body:{name,slug,site_type}
     });

     if(result.error)throw result.error;
     if(result.data?.error)throw new Error(result.data.error);

     closeCreate();
     toast('Projeto criado ✓','success');
     await load();

     const created=result.data?.project;
     if(created?.slug){
       window.VITRINE_PROJECT_CONTEXT?.set?.(created.slug);
       location.href=`/admin/dashboard.html?project=${encodeURIComponent(created.slug)}`;
     }
   }catch(err){
     console.error(err);
     toast(window.WebAppCapUX.friendlyError(err),'error');
   }finally{
     window.WebAppCapUX.setButtonBusy(btn,false);
   }
 };

 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});

 const session=(await sb.auth.getSession()).data.session;
 if(!session){location.replace('/admin/?next='+encodeURIComponent('/admin/projects.html'));return}
 user=session.user;
 $('app').classList.remove('hidden');
 try{await load()}catch(e){console.error(e);toast(window.WebAppCapUX.friendlyError(e),'error')}
})();
</script>
</body>
</html>
