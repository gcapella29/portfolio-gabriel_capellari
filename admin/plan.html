<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Plano comercial — WebAppCap</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--d:#082720;--f:#0e3b2e;--p:#f7f4ec;--i:#171310;--g:#e3bb3d;--m:#728078;--l:#ded8c8;--ok:#277a52;--warn:#b37a15;--bad:#aa4638;--sh:0 18px 55px rgba(8,39,32,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font-family:Inter,sans-serif}.hidden{display:none!important}h1,h2,h3{font-family:Fraunces,serif}.shell{max-width:1050px;margin:auto;padding:2rem 1rem 5rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.top h1{font-size:clamp(2.4rem,6vw,4rem);margin:.2rem 0}.top p{color:var(--m);line-height:1.55}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:.76rem 1rem;font:600 .68rem "IBM Plex Mono",monospace;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--g);color:var(--d)}.ghost{background:#fff;border:1px solid var(--l)}.dark{background:var(--d);color:#fff}.card{background:#fff;border:1px solid var(--l);border-radius:19px;box-shadow:var(--sh)}.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;margin:1.3rem 0}.plan{padding:1rem;cursor:pointer;position:relative}.plan.selected{outline:3px solid var(--g);outline-offset:2px}.plan h3{font-size:1.4rem;margin:.3rem 0}.plan p{font-size:.78rem;color:var(--m);line-height:1.5}.tag{font:600 .59rem "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--m)}.limits{display:grid;gap:.4rem;margin-top:.8rem;font-size:.73rem}.limit{display:flex;justify-content:space-between;border-top:1px solid #eee9dd;padding-top:.42rem}.form{padding:1.2rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}.field{display:grid;gap:.4rem}.field label{font:600 .62rem "IBM Plex Mono",monospace;text-transform:uppercase;color:var(--m)}.field input,.field select,.field textarea{padding:.8rem;border:1px solid var(--l);border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:100px;resize:vertical}.wide{grid-column:1/-1}.footer-actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}.summary{margin-top:1rem;padding:.9rem 1rem;border-radius:13px;background:#f3f0e8;font-size:.78rem;color:var(--m);line-height:1.5}.toast{position:fixed;right:1rem;bottom:1rem;background:var(--d);color:#fff;padding:.8rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:760px){.top{display:block}.actions{margin-top:1rem}.plans,.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<main class="shell"><header class="top"><div><div style="font:600 .65rem 'IBM Plex Mono',monospace;color:var(--m)">WEBAPPCAP · COMERCIAL</div><h1 id="title">Plano do projeto</h1><p>Configuração comercial interna. O cliente não visualiza preços, status financeiro ou limites contratados.</p></div><div class="actions"><a class="btn ghost" id="dashboard">← Dashboard</a><a class="btn dark" href="/admin/projects.html">Projetos</a></div></header>

<section class="plans" id="plans"></section>

<section class="card form"><div class="grid">
<div class="field"><label>Status</label><select id="status"><option value="trial">Teste / implantação</option><option value="active">Ativo</option><option value="past_due">Pagamento pendente</option><option value="paused">Pausado</option><option value="canceled">Cancelado</option></select></div>
<div class="field"><label>Ciclo</label><select id="cycle"><option value="monthly">Mensal</option><option value="yearly">Anual</option><option value="manual">Manual / sem recorrência automática</option></select></div>
<div class="field"><label>Mensalidade / valor do ciclo (R$)</label><input id="price" inputmode="decimal" placeholder="Ex.: 99,90"></div>
<div class="field"><label>Moeda</label><select id="currency"><option value="BRL">BRL — Real</option><option value="USD">USD — Dólar</option><option value="EUR">EUR — Euro</option></select></div>
<div class="field"><label>Início</label><input id="started" type="date"></div>
<div class="field"><label>Próxima renovação</label><input id="renews" type="date"></div>
<div class="field"><label>Fim do teste</label><input id="trialEnds" type="date"></div>
<div class="field wide"><label>Observações internas</label><textarea id="notes" placeholder="Condições combinadas, descontos, particularidades do cliente..."></textarea></div>
</div><div class="summary" id="summary">—</div><div class="footer-actions"><button class="btn gold" id="save">Salvar configuração comercial</button></div></section>
</main><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="./plans-config.js"></script>
<script>
(async()=>{const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),slug=new URLSearchParams(location.search).get('project')||cfg.projectSlug;let user,project,row=null,selected='pro';const toast=m=>{$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)};const dateValue=v=>v?new Date(v).toISOString().slice(0,10):'';const cents=v=>{const n=Number(String(v).replace('.','').replace(',','.'));return Number.isFinite(n)?Math.round(n*100):null};const money=n=>n==null?'—':(n/100).toLocaleString('pt-BR',{style:'currency',currency:$('currency').value||'BRL'});function renderPlans(){const defs=window.WebAppCapPlans;$('plans').innerHTML=Object.entries(defs).map(([key,p])=>`<article class="card plan ${selected===key?'selected':''}" data-plan="${key}"><div class="tag">${key}</div><h3>${p.name}</h3><p>${p.description}</p><div class="limits"><div class="limit"><span>Usuários cliente</span><strong>${p.limits.client_users}</strong></div><div class="limit"><span>Domínio próprio</span><strong>${p.limits.custom_domain?'Sim':'Não'}</strong></div><div class="limit"><span>Galeria</span><strong>${p.limits.media_gallery} fotos</strong></div><div class="limit"><span>Tema avançado</span><strong>${p.limits.advanced_theme?'Sim':'Não'}</strong></div></div></article>`).join('');document.querySelectorAll('[data-plan]').forEach(el=>el.onclick=()=>{selected=el.dataset.plan;renderPlans();renderSummary()})}function renderSummary(){const p=window.WebAppCapPlans[selected];$('summary').innerHTML=`<strong>${p.name}</strong> · ${$('status').selectedOptions[0]?.textContent||''} · ${$('cycle').selectedOptions[0]?.textContent||''} · ${money(cents($('price').value))}<br>Limites: ${p.limits.client_users} cliente(s), ${p.limits.media_gallery} fotos de galeria, domínio próprio ${p.limits.custom_domain?'incluído':'não incluído'}.`}['status','cycle','price','currency','started','renews','trialEnds','notes'].forEach(id=>$(id).addEventListener('input',renderSummary));const s=(await sb.auth.getSession()).data.session;if(!s){location.replace('/admin/');return}user=s.user;const pq=await sb.from('projects').select('id,name,owner_id').eq('slug',slug).maybeSingle();if(pq.error||!pq.data){toast('Projeto não encontrado');return}project=pq.data;if(project.owner_id!==user.id){const m=await sb.from('project_members').select('role').eq('project_id',project.id).eq('user_id',user.id).maybeSingle();if(m.data?.role!=='owner'){location.replace(`/admin/client.html?project=${encodeURIComponent(slug)}`);return}}$('title').textContent=`Plano · ${project.name}`;$('dashboard').href=`/admin/dashboard.html?project=${encodeURIComponent(slug)}`;const q=await sb.from('project_commercial').select('*').eq('project_id',project.id).maybeSingle();if(q.error){toast(q.error.message);return}row=q.data;if(row){selected=row.plan_code||'pro';$('status').value=row.status||'trial';$('cycle').value=row.billing_cycle||'monthly';$('currency').value=row.currency||'BRL';$('price').value=row.price_cents==null?'':(row.price_cents/100).toFixed(2).replace('.',',');$('started').value=dateValue(row.started_at);$('renews').value=dateValue(row.renews_at);$('trialEnds').value=dateValue(row.trial_ends_at);$('notes').value=row.notes||''}renderPlans();renderSummary();$('save').onclick=async()=>{const preset=window.WebAppCapPlans[selected],payload={project_id:project.id,plan_code:selected,status:$('status').value,billing_cycle:$('cycle').value,price_cents:cents($('price').value),currency:$('currency').value,started_at:$('started').value||null,renews_at:$('renews').value||null,trial_ends_at:$('trialEnds').value||null,limits:preset.limits,notes:$('notes').value.trim()||null,updated_by:user.id,updated_at:new Date().toISOString()};const u=await sb.from('project_commercial').upsert(payload,{onConflict:'project_id'}).select().single();if(u.error){toast(u.error.message);return}row=u.data;toast('Plano comercial salvo ✓')}})();
</script></body></html>
