<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Leads — WebAppCap</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--surface:#fff;--shadow:0 18px 55px rgba(8,39,32,.1)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}h1,h2,h3{font-family:Fraunces,serif}.shell{max-width:1180px;margin:auto;padding:2rem 1rem 5rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.top h1{font-size:clamp(2.5rem,6vw,4rem);margin:.2rem 0}.mono{font:600 .65rem 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase}.btn{border:0;border-radius:999px;padding:.76rem 1rem;font:600 .68rem 'IBM Plex Mono',monospace;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.toolbar{display:grid;grid-template-columns:1fr 190px;gap:.7rem;margin:1.2rem 0}.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;padding:.75rem .9rem;font:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1rem}.stat,.lead-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:1rem}.stat strong{display:block;font:700 1.8rem Fraunces,serif}.stat span{font-size:.72rem;color:var(--muted)}.list{display:grid;gap:.8rem}.lead-card{padding:1rem}.lead-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.lead-name{font:700 1.15rem Fraunces,serif}.lead-meta{font:.72rem 'IBM Plex Mono',monospace;color:var(--muted);margin-top:.25rem}.pill{display:inline-flex;border-radius:999px;padding:.35rem .55rem;font:600 .62rem 'IBM Plex Mono',monospace;background:#f0ece1}.lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.9rem}.lead-block{display:grid;gap:.4rem}.lead-block a{color:var(--dark)}.lead-message{white-space:pre-wrap;line-height:1.55;color:#444}.lead-controls{display:grid;grid-template-columns:180px 1fr auto;gap:.65rem;margin-top:1rem;align-items:start}.lead-controls select,.lead-controls textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:.7rem;font:inherit}.lead-controls textarea{min-height:76px;resize:vertical}.save{background:var(--gold);color:var(--ink);align-self:stretch}.empty,.error{padding:2rem;text-align:center;color:var(--muted)}.error{color:#7a2f26}.loading{opacity:.55;pointer-events:none}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.toolbar,.lead-grid,.lead-controls{grid-template-columns:1fr}.top{display:block}.top .btn{margin-top:1rem}}@media(max-width:460px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell" id="app">
<header class="top"><div><div class="mono">WEBAPPCAP · LEADS</div><h1 id="title">Leads</h1><p style="color:var(--muted);max-width:62ch">Acompanhe contatos recebidos pelo site e organize o andamento comercial.</p></div><a class="btn ghost" id="back">← Dashboard</a></header>
<section class="stats"><div class="stat"><strong id="total">0</strong><span>Total</span></div><div class="stat"><strong id="newCount">0</strong><span>Novos</span></div><div class="stat"><strong id="qualifiedCount">0</strong><span>Qualificados</span></div><div class="stat"><strong id="wonCount">0</strong><span>Convertidos</span></div></section>
<div class="toolbar"><input id="search" placeholder="Buscar por nome, e-mail ou telefone"><select id="statusFilter"><option value="all">Todos os status</option><option value="new">Novo</option><option value="contacted">Contatado</option><option value="qualified">Qualificado</option><option value="won">Convertido</option><option value="lost">Perdido</option></select></div>
<section class="list" id="list"></section><div class="error" id="error" hidden></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="/project-context.js"></script><script src="/admin/access-control.js"></script><script src="/admin/route-guard.js"></script>
<script>(()=>{
const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),slug=params.get('project');let project=null,rows=[];
const labels={new:'Novo',contacted:'Contatado',qualified:'Qualificado',won:'Convertido',lost:'Perdido'};const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');const fmt=v=>new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
function updateStats(){ $('total').textContent=rows.length;$('newCount').textContent=rows.filter(x=>x.status==='new').length;$('qualifiedCount').textContent=rows.filter(x=>x.status==='qualified').length;$('wonCount').textContent=rows.filter(x=>x.status==='won').length; }
function filtered(){const q=$('search').value.trim().toLowerCase(),s=$('statusFilter').value;return rows.filter(x=>(s==='all'||x.status===s)&&(!q||[x.name,x.email,x.phone].some(v=>String(v||'').toLowerCase().includes(q))))}
function render(){const data=filtered();const list=$('list');if(!data.length){list.innerHTML='<div class="empty">Nenhum lead encontrado.</div>';return}list.innerHTML=data.map(x=>`<article class="lead-card" data-id="${x.id}"><div class="lead-head"><div><div class="lead-name">${esc(x.name)}</div><div class="lead-meta">${fmt(x.created_at)} · ${esc(x.source||'site_form')}</div></div><span class="pill">${labels[x.status]||x.status}</span></div><div class="lead-grid"><div class="lead-block"><strong>Contato</strong>${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:''}${x.phone?`<a href="https://wa.me/${esc(String(x.phone).replace(/\D/g,''))}" target="_blank" rel="noopener">${esc(x.phone)}</a>`:''}</div><div class="lead-block"><strong>Mensagem</strong><div class="lead-message">${esc(x.message||'—')}</div></div></div><div class="lead-controls"><select data-role="status">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${k===x.status?'selected':''}>${v}</option>`).join('')}</select><textarea data-role="notes" placeholder="Observações internas">${esc(x.notes||'')}</textarea><button class="btn save" data-role="save">Salvar</button></div></article>`).join('');list.querySelectorAll('[data-role="save"]').forEach(btn=>btn.onclick=()=>save(btn.closest('.lead-card')))}
async function save(card){const id=Number(card.dataset.id),status=card.querySelector('[data-role="status"]').value,notes=card.querySelector('[data-role="notes"]').value.trim(),btn=card.querySelector('[data-role="save"]');btn.disabled=true;btn.textContent='Salvando…';const {data,error}=await sb.from('site_leads').update({status,notes,updated_at:new Date().toISOString()}).eq('id',id).eq('project_id',project.id).select('id,status,notes').single();if(error){alert(error.message)}else{const row=rows.find(x=>x.id===id);if(row){row.status=data.status;row.notes=data.notes}updateStats();render()}btn.disabled=false;btn.textContent='Salvar'}
async function load(){if(!slug)throw new Error('Projeto não informado.');$('app').classList.add('loading');const p=await sb.from('projects').select('id,name,slug').eq('slug',slug).maybeSingle();if(p.error||!p.data)throw p.error||new Error('Projeto não encontrado.');project=p.data;$('title').textContent=`Leads · ${project.name}`;$('back').href=`/admin/dashboard.html?project=${encodeURIComponent(slug)}`;const r=await sb.from('site_leads').select('id,name,email,phone,message,source,path,status,notes,created_at,updated_at').eq('project_id',project.id).order('created_at',{ascending:false}).limit(500);if(r.error)throw r.error;rows=r.data||[];updateStats();render();$('app').classList.remove('loading')}
$('search').addEventListener('input',render);$('statusFilter').addEventListener('change',render);sb.auth.getSession().then(({data})=>{if(!data.session){location.replace(`/admin/?next=${encodeURIComponent(location.pathname+location.search)}`);return}load().catch(e=>{$('error').hidden=false;$('error').textContent=e.message||'Não foi possível carregar os leads.';$('app').classList.remove('loading')})});
})();</script></body></html>
