<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAppCap — Editor de Template</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--danger:#a83c2e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.hidden{display:none!important}.shell{max-width:1100px;margin:auto;padding:2rem 1rem 4rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.top h1{font:600 clamp(2.2rem,5vw,3.3rem) Fraunces,serif;margin:.2rem 0}.ey{font:600 .65rem 'IBM Plex Mono',monospace;color:var(--muted)}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:.75rem .95rem;font:600 .68rem 'IBM Plex Mono',monospace;cursor:pointer;text-decoration:none}.gold{background:var(--gold);color:var(--dark)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.2rem}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.2rem}.card h2{font-family:Fraunces,serif;margin-top:0}.field{display:grid;gap:.4rem;margin-bottom:.8rem}.field label{font:600 .62rem 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase}.field input,.field textarea,.field select{width:100%;padding:.78rem;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:100px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.module{display:grid;grid-template-columns:1fr auto auto;gap:.7rem;align-items:center;border:1px solid var(--line);border-radius:12px;padding:.75rem;margin-bottom:.55rem}.module small{display:block;color:var(--muted);margin:.2rem 0 .5rem}.module select{max-width:230px;padding:.5rem;border:1px solid var(--line);border-radius:8px}.move{display:flex;gap:.25rem}.move button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff}.note{margin-top:1rem;padding:.85rem 1rem;background:#fff8df;border:1px solid #ead9a0;border-radius:12px;color:#6d5a1e;font-size:.78rem;line-height:1.5}.toast{position:fixed;right:1rem;bottom:1rem;background:var(--dark);color:#fff;padding:.8rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.2s}.toast.show{opacity:1;transform:none}.fatal{max-width:760px;margin:3rem auto;padding:1rem;background:#fff;border:1px solid #e0b1aa;border-radius:14px;color:var(--danger)}@media(max-width:800px){.grid,.colors{grid-template-columns:1fr}.top{flex-direction:column}.module{grid-template-columns:1fr}}</style></head><body><div id="fatal" class="fatal hidden"></div><main class="shell hidden" id="app"><header class="top"><div><div class="ey">WEBAPPCAP · TEMPLATE LIBRARY</div><h1 id="title">Template</h1><div id="source" class="ey"></div></div><div class="actions"><a class="btn ghost" href="/admin/projects.html">Projetos</a><a class="btn ghost" href="javascript:history.back()">← Voltar</a></div></header><div class="note"><strong>Este é o padrão global.</strong> Alterações salvas aqui serão usadas por novos projetos deste tema. Projetos já existentes só mudam quando você reaplica o template neles.</div><div class="grid"><section class="card"><h2>Identidade do template</h2><div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>Descrição</label><textarea id="description"></textarea></div><div class="field"><label>Destaques (separados por vírgula)</label><input id="chips"></div><h2>Aparência-base</h2><div class="colors"><div class="field"><label>Primária</label><input id="primary" type="color"></div><div class="field"><label>Secundária</label><input id="secondary" type="color"></div><div class="field"><label>Destaque</label><input id="accent" type="color"></div><div class="field"><label>Fundo</label><input id="background" type="color"></div></div><div class="field"><label>Fonte dos títulos</label><select id="heading"><option>Fraunces</option><option>Playfair Display</option><option>Montserrat</option><option>Manrope</option></select></div><div class="field"><label>Fonte do texto</label><select id="bodyFont"><option>Inter</option><option>DM Sans</option><option>Manrope</option><option>Montserrat</option></select></div><div class="field"><label>Largura</label><select id="width"><option>980</option><option>1100</option><option>1200</option><option>1320</option><option>1440</option></select></div><div class="field"><label>Arredondamento</label><select id="radius"><option value="none">Nenhum</option><option value="small">Pequeno</option><option value="medium">Médio</option><option value="large">Grande</option></select></div></section><section class="card"><h2>Módulos padrão</h2><div id="modules"></div></section></div><div class="actions" style="justify-content:flex-end;margin-top:1rem"><button class="btn ghost" id="seed">Inicializar biblioteca no Supabase</button><button class="btn gold" id="save">Salvar padrão global</button></div></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="/template-registry.js"></script><script src="/template-store.js"></script><script src="/design-system.js"></script><script src="/admin/template-editor.js"></script></body></html>
