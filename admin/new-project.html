<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAppCap — Novo projeto</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}h1,h2,h3{font-family:Fraunces,serif}.shell{max-width:980px;margin:auto;padding:2rem 1rem 4rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.top h1{font-size:clamp(2.2rem,5vw,3.2rem);margin:0}.help{color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1rem 0 1.4rem}.step{padding:.7rem;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.75rem}.step.active{background:var(--dark);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.2rem}.hidden{display:none!important}.grid,.templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}.field{display:grid;gap:.4rem}.field label{font:600 .66rem 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase}.field input,.field textarea{padding:.82rem;border:1px solid var(--line);border-radius:10px;width:100%}.field textarea{min-height:100px}.template{border:1px solid var(--line);border-radius:14px;padding:1rem;cursor:pointer}.template.selected{outline:3px solid var(--gold)}.template p{font-size:.8rem;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem}.btn{border:0;border-radius:999px;padding:.75rem 1rem;font:600 .68rem 'IBM Plex Mono',monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:var(--dark)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.summary-row{display:grid;grid-template-columns:170px 1fr;gap:.6rem;padding:.65rem 0;border-bottom:1px solid #eee}.toast{position:fixed;right:1rem;bottom:1rem;background:var(--dark);color:#fff;padding:.8rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.steps,.grid,.templates{grid-template-columns:1fr}.top,.actions{flex-direction:column}}
</style></head><body><main class="shell"><header class="top"><div><div style="font:600 .65rem 'IBM Plex Mono',monospace;color:var(--muted)">WEBAPPCAP · CMS</div><h1>Novo projeto</h1><p class="help">Criação guiada com template, estrutura e aparência inicial.</p></div><a class="btn ghost" href="/admin/projects.html">← Projetos</a></header><div class="steps" id="steps"></div>
<section class="card" id="step1"><h2>1. Tipo de projeto</h2><div class="templates" id="choices"></div></section>
<section class="card hidden" id="step2"><h2>2. Identidade</h2><div class="grid"><div class="field"><label>Nome do projeto</label><input id="name"></div><div class="field"><label>Slug</label><input id="slug"></div><div class="field"><label>Subdomínio</label><input id="subdomain"></div><div class="field"><label>Localização</label><input id="location"></div><div class="field" style="grid-column:1/-1"><label>Cargo / posicionamento</label><input id="role"></div></div></section>
<section class="card hidden" id="step3"><h2>3. Informações iniciais</h2><div class="grid"><div class="field"><label>E-mail</label><input id="email"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div><div class="field"><label>Instagram</label><input id="instagram"></div><div class="field"><label>Idiomas</label><input id="languages" placeholder="Português:nativo, Inglês:C1"></div><div class="field" style="grid-column:1/-1"><label>Resumo / Sobre</label><textarea id="about"></textarea></div></div></section>
<section class="card hidden" id="step4"><h2>4. Revisão</h2><div id="summary"></div><p class="help">Depois de criar, você poderá editar tudo normalmente.</p></section>
<div class="actions"><button class="btn ghost hidden" id="back">← Voltar</button><div style="margin-left:auto;display:flex;gap:.6rem"><button class="btn gold" id="next">Continuar →</button><button class="btn gold hidden" id="create">Criar projeto</button></div></div></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>
(()=>{const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),presets={
 editorial:{name:'Editorial / Jornalista',site_type:'editorial',theme:{colors:{primary:'#082720',secondary:'#0e3b2e',accent:'#e3bb3d',background:'#f7f4ec',surface:'#ffffff',text:'#171310',muted:'#728078'},typography:{heading:'Fraunces',body:'Inter',mono:'IBM Plex Mono',scale:'normal'},layout:{content_width:'1200',section_spacing:'normal',radius:'medium',density:'comfortable'},buttons:{style:'pill',weight:'600'},effects:{shadow:'soft',motion:'normal'}},layout:[['ticker',true,'marquee'],['stats',true,'cards'],['about',true,'image-left'],['wsop',true,'featured'],['coverage',true,'rows'],['portfolio',true,'featured'],['experience',true,'timeline'],['education',true,'split'],['instagram',true,'featured'],['contact',true,'split']]},
 fitness:{name:'Personal Trainer / Fitness',site_type:'fitness',theme:{colors:{primary:'#111111',secondary:'#242424',accent:'#d9ff43',background:'#f4f4f0',surface:'#ffffff',text:'#141414',muted:'#696969'},typography:{heading:'Montserrat',body:'DM Sans',mono:'IBM Plex Mono',scale:'large'},layout:{content_width:'1180',section_spacing:'normal',radius:'large',density:'comfortable'},buttons:{style:'pill',weight:'700'},effects:{shadow:'strong',motion:'normal'}},layout:[['stats',true,'minimal'],['about',true,'image-right'],['coverage',true,'cards'],['portfolio',true,'cards'],['experience',true,'cards'],['education',true,'stacked'],['instagram',true,'featured'],['contact',true,'centered'],['ticker',false,'compact'],['wsop',false,'compact']]},
 educator:{name:'Professor / Consultor',site_type:'educator',theme:{colors:{primary:'#152a44',secondary:'#244c67',accent:'#f0b84b',background:'#f7f8fb',surface:'#ffffff',text:'#17202a',muted:'#687684'},typography:{heading:'Playfair Display',body:'Manrope',mono:'IBM Plex Mono',scale:'normal'},layout:{content_width:'1080',section_spacing:'airy',radius:'medium',density:'comfortable'},buttons:{style:'soft',weight:'600'},effects:{shadow:'soft',motion:'subtle'}},layout:[['about',true,'image-left'],['stats',true,'split'],['portfolio',true,'list'],['experience',true,'timeline'],['education',true,'split'],['instagram',true,'minimal'],['contact',true,'centered'],['ticker',false,'compact'],['wsop',false,'compact'],['coverage',false,'compact']]},
 local:{name:'Comércio Local',site_type:'local',theme:{colors:{primary:'#4b241d',secondary:'#754234',accent:'#e4b66e',background:'#fbf7f1',surface:'#ffffff',text:'#2b201c',muted:'#806f65'},typography:{heading:'Playfair Display',body:'DM Sans',mono:'IBM Plex Mono',scale:'normal'},layout:{content_width:'1100',section_spacing:'normal',radius:'large',density:'spacious'},buttons:{style:'soft',weight:'700'},effects:{shadow:'soft',motion:'subtle'}},layout:[['about',true,'centered'],['portfolio',true,'cards'],['instagram',true,'featured'],['contact',true,'centered'],['stats',false,'minimal'],['ticker',false,'compact'],['wsop',false,'compact'],['coverage',false,'compact'],['experience',false,'compact'],['education',false,'compact']]}
};let user=null,step=1,selected='fitness';const toast=m=>{$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)},slugify=v=>v.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80);function renderChoices(){$('choices').innerHTML=Object.entries(presets).map(([k,p])=>`<div class="template ${selected===k?'selected':''}" data-k="${k}"><h3>${p.name}</h3><p>${p.site_type}</p></div>`).join('');document.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{selected=x.dataset.k;renderChoices()})}function render(){$('steps').innerHTML=[1,2,3,4].map(n=>`<div class="step ${n===step?'active':''}">${n} · ${['Tipo','Identidade','Conteúdo','Revisão'][n-1]}</div>`).join('');[1,2,3,4].forEach(n=>$('step'+n).classList.toggle('hidden',n!==step));$('back').classList.toggle('hidden',step===1);$('next').classList.toggle('hidden',step===4);$('create').classList.toggle('hidden',step!==4);if(step===4)summary()}function summary(){const p=presets[selected],rows=[['Template',p.name],['Nome',$('name').value],['Slug',$('slug').value],['Subdomínio',$('subdomain').value||'—'],['Localização',$('location').value||'—'],['Posicionamento',$('role').value||'—']];$('summary').innerHTML=rows.map(([a,b])=>`<div class="summary-row"><strong>${a}</strong><span>${b}</span></div>`).join('')}$('name').oninput=()=>{if(!$('slug').dataset.manual)$('slug').value=slugify($('name').value)};$('slug').oninput=()=>$('slug').dataset.manual='1';$('next').onclick=()=>{if(step===2&&!$('name').value.trim())return toast('Digite o nome do projeto.');step=Math.min(4,step+1);render()};$('back').onclick=()=>{step=Math.max(1,step-1);render()};const parseLang=()=>$('languages').value.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const [language,level]=x.split(':').map(y=>y?.trim());return{flag:'',language,level:level||''}});async function platformOwner(){const q=await sb.from('projects').select('owner_id').eq('slug',cfg.projectSlug).maybeSingle();return q.data?.owner_id===user.id}$('create').onclick=async()=>{if(!(await platformOwner()))return toast('Somente a conta principal pode criar projetos.');const btn=$('create');btn.disabled=true;btn.textContent='Criando…';try{const p=presets[selected],slug=slugify($('slug').value||$('name').value),sub=slugify($('subdomain').value).slice(0,63)||null;const modules=p.layout.map(([key,visible,variant],order)=>({key,visible,variant,order})),snapshot={hero:{is_visible:true,content:{name_html:$('name').value.trim(),location:$('location').value.trim(),role_pt:$('role').value.trim(),role_en:$('role').value.trim(),languages:parseLang(),ticker:[]}},about:{is_visible:!!$('about').value.trim(),content:{paragraph1_pt:$('about').value.trim(),paragraph1_en:$('about').value.trim()}},stats:{is_visible:true,content:{items:[]}},wsop:{is_visible:false,content:{}},coverage:{is_visible:false,content:{items:[]}},portfolio:{is_visible:true,content:{items:[]}},experience:{is_visible:true,content:{items:[]}},education:{is_visible:true,content:{items:[]}},instagram:{is_visible:!!$('instagram').value.trim(),content:{eyebrow_pt:'Redes',eyebrow_en:'Social',title_pt:'Instagram',title_en:'Instagram',text_pt:'',text_en:'',user:$('instagram').value.trim().replace(/^@/,'').replace(/^https?:\/\/[^/]+\//,'').replace(/\/$/,''),reel_url:''}},contact:{is_visible:true,content:{title_pt:'Contato',title_en:'Contact',email1:$('email').value.trim(),email2:'',whatsapp_number:$('whatsapp').value.replace(/\D/g,''),whatsapp_display:$('whatsapp').value.trim(),instagram_user:$('instagram').value.trim().replace(/^@/,'').replace(/^https?:\/\/[^/]+\//,'').replace(/\/$/,''),linkedin_url:''}},media:{is_visible:true,content:{hero_url:'',hero_path:'',hero_fit:'cover',hero_x:50,hero_y:50,hero_zoom:1,about_url:'',about_path:'',about_alt:'',about_fit:'cover',about_x:50,about_y:0,about_zoom:1,contact_url:'',contact_path:'',contact_alt:'',contact_fit:'cover',contact_x:50,contact_y:50,contact_zoom:1,wsop_gallery:[]}},seo:{is_visible:true,content:{title_pt:$('name').value.trim(),description_pt:$('role').value.trim()}},layout:{is_visible:true,content:{version:1,modules}},theme:{is_visible:true,content:structuredClone(p.theme)},template:{is_visible:true,content:{key:selected,name:p.name,applied_at:new Date().toISOString()}}};const result=await sb.functions.invoke('create-project',{body:{slug,name:$('name').value.trim(),site_type:p.site_type,subdomain:sub,snapshot}});if(result.error)throw result.error;if(result.data?.error)throw new Error(result.data.error);toast('Projeto criado ✓');setTimeout(()=>location.href=`/admin/dashboard.html?project=${encodeURIComponent(slug)}`,700)}catch(e){console.error(e);toast(e.message||'Erro ao criar projeto.')}finally{btn.disabled=false;btn.textContent='Criar projeto'}};sb.auth.getSession().then(async({data})=>{user=data.session?.user;if(!user)return location.href='/admin/';if(!(await platformOwner()))return location.href='/admin/projects.html';renderChoices();render()})})();
</script></body></html>
