<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAppCap — Novo projeto</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}h1,h2,h3{font-family:Fraunces,serif}.shell{max-width:980px;margin:auto;padding:2rem 1rem 4rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.top h1{font-size:clamp(2.2rem,5vw,3.2rem);margin:0}.help{color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1rem 0 1.4rem}.step{padding:.7rem;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.75rem}.step.active{background:var(--dark);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:1.2rem}.hidden{display:none!important}.grid,.templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}.field{display:grid;gap:.4rem}.field label{font:600 .66rem 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase}.field input,.field textarea{padding:.82rem;border:1px solid var(--line);border-radius:10px;width:100%}.field textarea{min-height:100px}.template{border:1px solid var(--line);border-radius:14px;padding:1rem;cursor:pointer}.template.selected{outline:3px solid var(--gold)}.template p{font-size:.8rem;color:var(--muted);line-height:1.5}.actions{display:flex;justify-content:space-between;gap:.6rem;margin-top:1rem}.btn{border:0;border-radius:999px;padding:.75rem 1rem;font:600 .68rem 'IBM Plex Mono',monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:var(--dark)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.summary-row{display:grid;grid-template-columns:170px 1fr;gap:.6rem;padding:.65rem 0;border-bottom:1px solid #eee}.toast{position:fixed;right:1rem;bottom:1rem;background:var(--dark);color:#fff;padding:.8rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.steps,.grid,.templates{grid-template-columns:1fr}.top,.actions{flex-direction:column}}
