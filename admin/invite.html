<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAppCap — Aceitar convite</title>
<style>:root{--d:#082720;--g:#e3bb3d;--p:#f7f4ec;--m:#728078;--l:#ded8c8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#082720,#0e3b2e);min-height:100vh;display:grid;place-items:center;padding:1rem}.card{width:min(440px,100%);background:var(--p);padding:2rem;border-radius:22px}h1{font-family:Georgia,serif;margin:0 0 .5rem}p{color:var(--m);line-height:1.5}.field{display:grid;gap:.4rem;margin:1rem 0}.field label{font-size:.72rem;text-transform:uppercase;color:var(--m)}input{width:100%;padding:.85rem;border:1px solid var(--l);border-radius:10px}.btn{width:100%;border:0;border-radius:999px;background:var(--g);color:var(--d);padding:.8rem;font-weight:bold;cursor:pointer}.msg{font-size:.82rem;min-height:1.2rem;margin:.7rem 0}</style></head>
<body><main class="card"><h1>WebAppCap</h1><p>Finalize seu acesso criando uma senha. Depois você poderá acessar o painel seguro do seu site.</p><form id="form"><div class="field"><label>Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Confirmar senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><div class="msg" id="msg"></div><button class="btn">Salvar senha e entrar</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<script>
(async()=>{const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);
$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';if($('password').value!==$('confirm').value){$('msg').textContent='As senhas não coincidem.';return}const r=await sb.auth.updateUser({password:$('password').value});if(r.error){$('msg').textContent=r.error.message;return}$('msg').textContent='Senha criada ✓';setTimeout(()=>location.href='/admin/client.html',700)};})();
</script></body></html>
