<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAppCap — Histórico</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/ux.css">
<style>
:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--ok:#2d7759;--warn:#9b6c16;--bad:#a83c2e;--shadow:0 18px 55px rgba(8,39,32,.1)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.hidden{display:none!important}.shell{max-width:1120px;margin:auto;padding:2rem 1rem 4rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.4rem}.top h1{font-family:Fraunces,serif;font-size:clamp(2.3rem,5vw,3.5rem);margin:.1rem 0}.mono{font:600 .64rem "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}.help{color:var(--muted);font-size:.78rem;line-height:1.55}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:.72rem .92rem;font:600 .68rem "IBM Plex Mono",monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.dark{background:var(--dark);color:#fff}.gold{background:var(--gold);color:var(--dark)}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:var(--shadow)}.stat small{display:block;font:600 .62rem "IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase;margin-bottom:.4rem}.stat strong{font-size:1.05rem}.list{display:grid;gap:.8rem}.version{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1rem;box-shadow:var(--shadow)}.version-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}.version h3{font-family:Fraunces,serif;margin:.05rem 0 .25rem;font-size:1.1rem}.meta{color:var(--muted);font-size:.76rem}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:.3rem .5rem;font:600 .6rem "IBM Plex Mono",monospace;margin-top:.55rem}.badge.ok{background:#eef8f2;border-color:#bdd9c9;color:var(--ok)}.badge.warn{background:#fff8e8;border-color:#ead7a8;color:var(--warn)}.diff{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.8rem}.chip{border:1px solid var(--line);border-radius:999px;padding:.33rem .52rem;font:500 .61rem "IBM Plex Mono",monospace;background:#fbfaf6}.details{margin-top:.8rem;border-top:1px solid var(--line);padding-top:.8rem;display:none}.details.open{display:block}.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}.detail{padding:.65rem;border:1px solid var(--line);border-radius:10px;background:#fbfaf6;font-size:.74rem}.detail strong{display:block;margin-bottom:.2rem}.empty{background:#fff;border:1px solid var(--line);border-radius:15px;padding:1.2rem;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;background:var(--dark);padding:1rem}.login-card{width:min(430px,100%);background:#fff;padding:1.5rem;border-radius:18px}.field{display:grid;gap:.4rem;margin:.7rem 0}.field input{padding:.8rem;border:1px solid var(--line);border-radius:10px}.toast{position:fixed;right:1rem;bottom:1rem;background:var(--dark);color:#fff;padding:.8rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:760px){.top,.version-head{flex-direction:column}.summary,.details-grid{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}}
</style></head>
<body>
<section class="login" id="loginView"><div class="login-card"><h2 style="font-family:Fraunces,serif;margin:0">WebAppCap</h2><p class="help">Entre para consultar o histórico do projeto.</p><form id="loginForm"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><div id="err" class="help" style="color:var(--bad)"></div><button class="btn gold">Entrar</button></form></div></section>
<main class="shell hidden" id="app"><header class="top"><div><div class="mono">WEBAPPCAP · VERSIONAMENTO</div><h1>Histórico</h1><p class="help" id="projectLabel">Carregando projeto…</p><div class="mono" id="roleLabel"></div></div><div class="actions"><a class="btn ghost" id="contentLink">← Conteúdo</a><a class="btn ghost" id="publishingLink">Publicação</a><a class="btn ghost" id="previewLink" target="_blank">Preview ↗</a></div></header>
<section class="summary"><div class="stat"><small>Versões salvas</small><strong id="versionCount">0</strong></div><div class="stat"><small>Rascunho atual</small><strong id="draftState">—</strong></div><div class="stat"><small>Última versão</small><strong id="latestAt">—</strong></div></section><div class="list" id="list"></div></main><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="/admin/route-guard.js"></script><script src="../project-context.js"></script><script src="/admin/ux.js"></script><script src="/admin/access-control.js"></script>
<script>
(()=>{
 const cfg=window.VITRINE_SUPABASE,resolver=window.WebAppCapTenantResolver,access=window.WebAppCapAccess;const sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let user=null,project=null,role=null,draft={snapshot:{}};
 const deepEqual=(a,b)=>JSON.stringify(a??null)===JSON.stringify(b??null);const fmt=v=>v?new Date(v).toLocaleString('pt-BR'):'—';
 function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
 function currentSlug(){return resolver.cleanSlug(new URLSearchParams(location.search).get('project')||window.VITRINE_PROJECT_CONTEXT?.slug)}
 const clientHome=()=>`/admin/client.html?project=${encodeURIComponent(project?.slug||currentSlug()||'')}`;
 async function loadProject(){const slug=currentSlug();if(!slug)throw new Error('Nenhum projeto foi selecionado. Abra o Histórico a partir da tela Projetos ou do editor.');const q=await sb.from('projects').select('id,slug,name,site_type').eq('slug',slug).maybeSingle();if(q.error)throw q.error;if(!q.data)throw new Error('Projeto não encontrado.');return q.data}
 async function loadRole(){const q=await sb.from('project_members').select('role').eq('project_id',project.id).eq('user_id',user.id).maybeSingle();if(q.error)throw q.error;role=access?.normalizeRole(q.data?.role)||null;if(!role)throw new Error('Você não tem acesso a este projeto.');if(!access?.can(role,'history')){location.replace(clientHome());return false}return true}
 function sectionDiff(versionSnapshot,currentSnapshot){const keys=[...new Set([...Object.keys(versionSnapshot||{}),...Object.keys(currentSnapshot||{})])];return keys.filter(k=>!deepEqual(versionSnapshot?.[k],currentSnapshot?.[k]))}
 function renderVersion(v){const changed=sectionDiff(v.snapshot||{},draft.snapshot||{});const synchronized=changed.length===0;const chips=changed.slice(0,8).map(k=>`<span class="chip">${k}</span>`).join('')+(changed.length>8?`<span class="chip">+${changed.length-8}</span>`:'');const details=changed.map(k=>`<div class="detail"><strong>${k}</strong><span>${v.snapshot?.[k]?'Presente na versão':'Ausente na versão'} · ${draft.snapshot?.[k]?'Presente no rascunho':'Ausente no rascunho'}</span></div>`).join('');const restore=access?.can(role,'restoreVersion')?`<button class="btn dark" data-restore="${v.id}">Restaurar como rascunho</button>`:'';return `<article class="version" data-version="${v.id}"><div class="version-head"><div><h3>${v.label||'Versão publicada'}</h3><div class="meta">${fmt(v.created_at)} · ${Object.keys(v.snapshot||{}).length} seções</div><span class="badge ${synchronized?'ok':'warn'}">${synchronized?'IGUAL AO RASCUNHO':changed.length+' SEÇÃO(ÕES) DIFERENTES'}</span></div><div class="actions"><button class="btn ghost" data-toggle="${v.id}" ${changed.length?'':'disabled'}>Comparar</button>${restore}</div></div>${changed.length?`<div class="diff">${chips}</div><div class="details" id="details-${v.id}"><div class="details-grid">${details}</div></div>`:''}</article>`}
 async function load(){const d=await sb.from('project_drafts').select('snapshot,updated_at,last_published_at').eq('project_id',project.id).maybeSingle();if(d.error)throw d.error;draft=d.data||{snapshot:{}};const q=await sb.from('project_versions').select('id,label,created_at,snapshot').eq('project_id',project.id).order('created_at',{ascending:false}).limit(50);if(q.error)throw q.error;const versions=q.data||[];$('versionCount').textContent=String(versions.length);$('draftState').textContent=draft.updated_at?fmt(draft.updated_at):'Sem rascunho';$('latestAt').textContent=versions[0]?fmt(versions[0].created_at):'Nenhuma';$('list').innerHTML=versions.length?versions.map(renderVersion).join(''):'<div class="empty">Ainda não há versões. A primeira aparecerá após uma publicação.</div>';
   $('list').querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>document.getElementById(`details-${btn.dataset.toggle}`)?.classList.toggle('open'));
   $('list').querySelectorAll('[data-restore]').forEach(btn=>btn.onclick=async()=>{if(!access?.can(role,'restoreVersion'))return toast('Seu perfil não pode restaurar versões.');const version=versions.find(v=>v.id===btn.dataset.restore);if(!version)return;const ok=await window.WebAppCapUX.confirm({title:'Restaurar esta versão?',message:'O rascunho atual será substituído por esta versão. O site publicado não será alterado até você publicar novamente.',confirmText:'Restaurar versão',danger:true});if(!ok)return;btn.disabled=true;try{const u=await sb.from('project_drafts').upsert({project_id:project.id,snapshot:version.snapshot||{},updated_by:user.id,updated_at:new Date().toISOString()},{onConflict:'project_id'});if(u.error)throw u.error;toast('Versão restaurada como rascunho ✓');await load()}catch(e){console.error(e);toast(e.message||'Erro ao restaurar versão.')}finally{btn.disabled=false}});
 }
 async function open(u){user=u;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');try{project=await loadProject();if(!(await loadRole()))return;const q=`?project=${encodeURIComponent(project.slug)}`;$('projectLabel').textContent=`${project.name} · ${project.slug}`;$('roleLabel').textContent=`Acesso: ${access?.label(role)||role}`;$('contentLink').href=`/admin/?project=${encodeURIComponent(project.slug)}`;$('publishingLink').href=`/admin/publishing.html${q}`;$('previewLink').href=`/preview.html?preview=draft&project=${encodeURIComponent(project.slug)}`;await load()}catch(e){console.error(e);if(project?.slug&&!access?.can(role,'history')){location.replace(clientHome());return}$('projectLabel').textContent='Erro ao carregar projeto';toast(e.message||'Não foi possível carregar o histórico.')}}
 $('loginForm').onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('err').textContent='E-mail ou senha inválidos.';return}open(r.data.user)};sb.auth.getSession().then(({data})=>{if(data.session?.user)open(data.session.user)});
})();
</script></body></html>
