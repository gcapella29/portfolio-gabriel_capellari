<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Formulário de Leads — WebAppCap</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--surface:#fff;--shadow:0 18px 55px rgba(8,39,32,.1)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.shell{max-width:980px;margin:auto;padding:2rem 1rem 5rem}h1,h2{font-family:Fraunces,serif}.top{display:flex;justify-content:space-between;gap:1rem}.top h1{font-size:clamp(2.4rem,6vw,4rem);margin:.2rem 0}.mono{font:600 .65rem 'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase}.btn{border:0;border-radius:999px;padding:.78rem 1rem;font:600 .68rem 'IBM Plex Mono',monospace;text-decoration:none;cursor:pointer}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.primary{background:var(--gold);color:var(--ink)}.card{margin-top:1rem;background:#fff;border:1px solid var(--line);border-radius:20px;padding:1.2rem;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.full{grid-column:1/-1}.field{display:grid;gap:.4rem}.field label,.check span{font-size:.78rem;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:.78rem;font:inherit}.field textarea{min-height:90px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:1rem}.check{display:flex;gap:.55rem;align-items:center;padding:.8rem;border:1px solid var(--line);border-radius:12px}.actions{display:flex;gap:.7rem;align-items:center;margin-top:1rem}.status{font-size:.82rem;color:var(--muted)}.status.ok{color:#27623e}.status.err{color:#8a3028}.loading{opacity:.55;pointer-events:none}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.full{grid-column:auto}.top{display:block}.top .btn{display:inline-block;margin-top:1rem}}</style></head>
<body><main class="shell" id="app"><header class="top"><div><div class="mono">WEBAPPCAP · CAPTAÇÃO</div><h1 id="title">Formulário</h1><p style="color:var(--muted);max-width:62ch">Configure o formulário público, campos obrigatórios e consentimento de privacidade.</p></div><a class="btn ghost" id="back">← Leads</a></header>
<section class="card"><div class="grid"><div class="field full"><label>Título</label><input id="formTitle" maxlength="120"></div><div class="field full"><label>Texto de apoio</label><textarea id="intro" maxlength="500"></textarea></div><div class="field full"><label>Texto de consentimento</label><textarea id="consentText" maxlength="1000"></textarea></div><div class="field"><label>URL da política de privacidade</label><input id="privacyUrl" maxlength="500" placeholder="https://..."></div><div class="field"><label>Texto do botão</label><input id="submitLabel" maxlength="80"></div><div class="field full"><label>Mensagem de sucesso</label><input id="successMessage" maxlength="240"></div></div>
<div class="checks"><label class="check"><input type="checkbox" id="enabled"><span>Formulário ativo</span></label><label class="check"><input type="checkbox" id="requireConsent"><span>Exigir consentimento</span></label><label class="check"><input type="checkbox" id="showEmail"><span>Mostrar e-mail</span></label><label class="check"><input type="checkbox" id="requireEmail"><span>E-mail obrigatório</span></label><label class="check"><input type="checkbox" id="showPhone"><span>Mostrar telefone</span></label><label class="check"><input type="checkbox" id="requirePhone"><span>Telefone obrigatório</span></label><label class="check"><input type="checkbox" id="showMessage"><span>Mostrar mensagem</span></label></div>
<div class="actions"><button class="btn primary" id="save">Salvar configurações</button><span class="status" id="status"></span></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="/project-context.js"></script><script src="/admin/access-control.js"></script><script src="/admin/route-guard.js"></script>
<script>(()=>{const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),params=new URLSearchParams(location.search),slug=params.get('project');let project=null;const defaults={enabled:true,title:'Envie uma mensagem',intro:'Preencha seus dados e retornaremos o contato.',show_email:true,show_phone:true,show_message:true,require_email:false,require_phone:false,require_consent:true,consent_text:'Concordo com o uso dos meus dados para retorno deste contato.',privacy_url:'',submit_label:'Enviar mensagem',success_message:'Mensagem enviada com sucesso.'};
function fill(s){s={...defaults,...s};$('enabled').checked=s.enabled;$('formTitle').value=s.title;$('intro').value=s.intro;$('showEmail').checked=s.show_email;$('showPhone').checked=s.show_phone;$('showMessage').checked=s.show_message;$('requireEmail').checked=s.require_email;$('requirePhone').checked=s.require_phone;$('requireConsent').checked=s.require_consent;$('consentText').value=s.consent_text;$('privacyUrl').value=s.privacy_url||'';$('submitLabel').value=s.submit_label;$('successMessage').value=s.success_message}
function payload(){return{project_id:project.id,enabled:$('enabled').checked,title:$('formTitle').value.trim()||defaults.title,intro:$('intro').value.trim(),show_email:$('showEmail').checked,show_phone:$('showPhone').checked,show_message:$('showMessage').checked,require_email:$('requireEmail').checked,require_phone:$('requirePhone').checked,require_consent:$('requireConsent').checked,consent_text:$('consentText').value.trim()||defaults.consent_text,privacy_url:$('privacyUrl').value.trim()||null,submit_label:$('submitLabel').value.trim()||defaults.submit_label,success_message:$('successMessage').value.trim()||defaults.success_message,updated_at:new Date().toISOString()}}
async function load(){if(!slug)throw new Error('Projeto não informado.');$('app').classList.add('loading');const p=await sb.from('projects').select('id,name,slug').eq('slug',slug).maybeSingle();if(p.error||!p.data)throw p.error||new Error('Projeto não encontrado.');project=p.data;$('title').textContent=`Formulário · ${project.name}`;$('back').href=`/admin/leads.html?project=${encodeURIComponent(slug)}`;const r=await sb.from('lead_form_settings').select('*').eq('project_id',project.id).maybeSingle();if(r.error)throw r.error;fill(r.data||defaults);$('app').classList.remove('loading')}
$('save').onclick=async()=>{const st=$('status');st.className='status';st.textContent='Salvando…';const p=payload();if(p.require_email&&!p.show_email){st.classList.add('err');st.textContent='Para exigir e-mail, o campo precisa estar visível.';return}if(p.require_phone&&!p.show_phone){st.classList.add('err');st.textContent='Para exigir telefone, o campo precisa estar visível.';return}if(!p.show_email&&!p.show_phone){st.classList.add('err');st.textContent='Mantenha ao menos e-mail ou telefone visível.';return}const r=await sb.from('lead_form_settings').upsert(p,{onConflict:'project_id'});if(r.error){st.classList.add('err');st.textContent=r.error.message}else{st.classList.add('ok');st.textContent='Configurações salvas.'}};
sb.auth.getSession().then(({data})=>{if(!data.session){location.replace(`/admin/?next=${encodeURIComponent(location.pathname+location.search)}`);return}load().catch(e=>{const st=$('status');st.className='status err';st.textContent=e.message||'Não foi possível carregar.';$('app').classList.remove('loading')})});})();</script></body></html>
