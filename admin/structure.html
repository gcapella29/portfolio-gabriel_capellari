<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAppCap — Estrutura</title><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--dark:#082720;--felt:#0e3b2e;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--danger:#a83c2e;--shadow:0 18px 55px rgba(8,39,32,.11)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,var(--dark),var(--felt));padding:1rem}.login-card{width:min(430px,100%);background:#fff;padding:2rem;border-radius:22px}h1,h2{font-family:Fraunces,serif}.btn{border:0;border-radius:999px;padding:.72rem .92rem;font:600 .68rem "IBM Plex Mono",monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:var(--dark)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.field{display:grid;gap:.4rem}.field label{font:600 .66rem "IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase}.field input{width:100%;padding:.8rem;border:1px solid var(--line);border-radius:10px}.shell{max-width:1050px;margin:auto;padding:2rem 1rem 4rem}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.4rem}.top h1{margin:0;font-size:clamp(2.2rem,5vw,3.3rem)}.top p{color:var(--muted)}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:1.15rem;box-shadow:var(--shadow)}.module-list{display:grid;gap:.7rem}.module{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;border:1px solid var(--line);border-radius:14px;padding:.85rem;background:#fff;cursor:grab}.module.off{opacity:.58}.module.dragging{opacity:.42}.module.drag-over{box-shadow:0 0 0 2px var(--gold) inset}.handle{font:600 1rem "IBM Plex Mono",monospace;color:#aaa}.meta strong{display:block}.meta>span{display:block;color:var(--muted);font-size:.76rem;margin-top:.25rem}.controls,.module-tools,.variant-wrap{display:flex;gap:.45rem;align-items:center}.variant-wrap{margin-top:.55rem;flex-wrap:wrap}.variant-wrap label{font:600 .62rem "IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase}.variant-wrap select{border:1px solid var(--line);border-radius:9px;padding:.48rem .55rem}.preview-chip{padding:.25rem .45rem;border-radius:999px;background:#f2efe6;color:var(--muted);font-size:.68rem}.toggle{font-size:.76rem}.small{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}.notice{background:#fff8df;border:1px solid #ead9a0;padding:.9rem 1rem;border-radius:12px;color:#6d5a1e;font-size:.78rem;line-height:1.5;margin-bottom:1rem}.savebar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1rem}.help{font-size:.76rem;color:var(--muted)}.toast{position:fixed;right:1rem;bottom:1rem;background:var(--dark);color:#fff;padding:.85rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.25s}.toast.show{opacity:1;transform:none}.reset-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.55rem .7rem;font:600 .64rem "IBM Plex Mono",monospace;cursor:pointer}@media(max-width:700px){.top,.savebar{flex-direction:column}.module{grid-template-columns:1fr}.actions .btn{flex:1}}</style><link rel="stylesheet" href="/admin/ux.css"></head><body><section class="login" id="loginView"><div class="login-card"><h1 style="margin:0">WebApp<span style="color:#c9a227">Cap</span></h1><p class="help">Entre para editar a estrutura do projeto.</p><form id="loginForm" style="display:grid;gap:.9rem"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><div id="err" style="color:var(--danger);font-size:.8rem"></div><button class="btn gold">Entrar</button></form></div></section><main class="shell hidden" id="app"><header class="top"><div><div style="font:600 .65rem 'IBM Plex Mono',monospace;color:var(--muted)">WEBAPPCAP · CMS</div><h1>Estrutura do site</h1><p id="projectLabel"></p></div><div class="actions"><a class="btn ghost" id="contentLink">← Conteúdo</a><a class="btn ghost" id="previewLink" target="_blank">Preview ↗</a></div></header><section class="card"><div class="notice"><strong>Estrutura governada pelo template aplicado.</strong> Você pode reordenar, ocultar e escolher variantes permitidas sem mudar o contrato do tema.</div><div class="module-list" id="list"></div><div class="savebar"><div class="help">Tudo fica em rascunho até a publicação.</div><div class="actions"><button class="reset-btn" id="resetButton">Restaurar padrão</button><button class="btn gold" id="saveButton">Salvar estrutura</button></div></div></section></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="/admin/route-guard.js"></script><script src="../project-context.js"></script><script src="/template-registry.js"></script><script src="/template-store.js"></script><script src="/design-system.js"></script><script src="/admin/ux.js"></script><script src="/admin/structure-v2.js"></script></body></html>
