backend:
  name: github
  repo: seu-usuario/seu-repositorio
  branch: main
  base_url: https://decap-cms-oauth-vercel.vercel.app # Ou o proxy de autenticação configurado

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "conteudo"
    label: "Conteúdo do Site"
    files:
      - file: "content/dados.json"
        label: "Informações Gerais"
        name: "dados"
        fields:
          - {label: "Nome Completo", name: "nome", widget: "string"}
          - {label: "Título Principal (Hero)", name: "titulo_hero", widget: "string"}
