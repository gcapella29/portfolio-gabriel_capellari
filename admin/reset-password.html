<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nova senha — WebAppCap</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--d:#082720;--f:#0e3b2e;--p:#f7f4ec;--i:#171310;--g:#e3bb3d;--m:#728078;--l:#ded8c8;--bad:#aa4638}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,var(--d),var(--f));font-family:Inter,sans-serif;padding:1rem}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:2rem;box-shadow:0 22px 70px rgba(0,0,0,.2)}h1{font:700 2.2rem Fraunces,serif;margin:.2rem 0 .5rem}p{color:var(--m);line-height:1.55}.field{display:grid;gap:.4rem;margin:1rem 0}.field label{font:600 .65rem 'IBM Plex Mono',monospace;text-transform:uppercase;color:var(--m)}input{width:100%;padding:.85rem;border:1px solid var(--l);border-radius:11px;font:inherit}.btn{border:0;border-radius:999px;padding:.78rem 1rem;font:600 .68rem 'IBM Plex Mono',monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--g);color:var(--d);width:100%}.ghost{margin-top:.75rem;color:var(--i)}.msg{font-size:.8rem;margin-top:.8rem}.ok{color:#277a52}.err{color:var(--bad)}
</style>
</head><body><main class="card"><div style="font:600 .65rem 'IBM Plex Mono',monospace;color:var(--m)">WEBAPPCAP · ACESSO</div><h1>Crie uma nova senha</h1><p>Use pelo menos 8 caracteres. Depois da troca, você poderá entrar normalmente no painel.</p><form id="form"><div class="field"><label>Nova senha</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>Confirmar senha</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn gold" id="save">Salvar nova senha</button><div id="msg" class="msg"></div></form><a class="btn ghost" href="/admin/">← Voltar ao login</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>
(()=>{const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();const p=$('password').value,c=$('confirm').value,msg=$('msg'),btn=$('save');msg.textContent='';if(p!==c){msg.textContent='As senhas não coincidem.';msg.className='msg err';return}btn.disabled=true;btn.textContent='Salvando…';try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;msg.textContent='Senha alterada com sucesso. Redirecionando…';msg.className='msg ok';setTimeout(()=>location.replace('/admin/'),1000)}catch(error){console.error(error);msg.textContent='O link pode ter expirado. Solicite uma nova recuperação.';msg.className='msg err';btn.disabled=false;btn.textContent='Salvar nova senha'}}})();
</script></body></html>
