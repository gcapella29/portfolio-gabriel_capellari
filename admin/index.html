<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vitrine Pro Admin — Fase 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--felt:#0e3b2e;--dark:#082720;--cream:#f3eee2;--paper:#f7f4ec;--ink:#171310;--gold:#c9a227;--gold2:#e3bb3d;--muted:#728078;--line:#ded8c8;--danger:#a83c2e;--radius:18px;--shadow:0 18px 55px rgba(8,39,32,.11)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:var(--paper)}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:1.2rem;background:linear-gradient(145deg,var(--dark),var(--felt))}
.login{width:min(440px,100%);background:var(--paper);padding:2rem;border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.25)}
.login h1,.top h1{font-family:Fraunces,serif;margin:0}.login h1{font-size:2.2rem}.login em,.brand em{font-style:normal;color:var(--gold2)}
.form{display:grid;gap:1rem}.field{display:grid;gap:.4rem}label{font:600 .67rem/1.2 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input,textarea{width:100%;padding:.82rem .9rem;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0;color:var(--ink)}textarea{min-height:120px;resize:vertical;line-height:1.5}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.12)}
.btn{border:0;border-radius:999px;padding:.75rem 1rem;font:600 .72rem/1 "IBM Plex Mono",monospace;display:inline-flex;justify-content:center;align-items:center;text-decoration:none}.btn.gold{background:var(--gold2);color:var(--dark)}.btn.dark{background:var(--dark);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#fff;border:1px solid #e4c0ba;color:var(--danger)}
.shell{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--dark);color:var(--cream);padding:1.25rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-family:Fraunces,serif;font-size:1.5rem}.sub{font:500 .62rem/1.5 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase;color:rgba(243,238,226,.52);margin-top:.3rem}
.nav{display:grid;gap:.35rem;margin-top:1.5rem;overflow:auto}.nav button{border:0;border-radius:11px;background:transparent;color:rgba(243,238,226,.7);padding:.72rem .8rem;text-align:left}.nav button.active{background:rgba(227,187,61,.13);color:var(--gold2)}.sidebar-bottom{margin-top:auto}.email{font:500 .66rem/1.4 "IBM Plex Mono",monospace;color:rgba(243,238,226,.55);word-break:break-all}.logout{margin-top:.7rem;width:100%;background:transparent;border:1px solid rgba(243,238,226,.16);color:#fff;padding:.7rem;border-radius:10px}
.main{padding:2rem clamp(1rem,4vw,4rem) 4rem;min-width:0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.5rem}.top h1{font-size:clamp(2rem,4vw,3rem)}.top-actions{display:flex;gap:.6rem;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.card-head{padding:1.1rem 1.25rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem}.card-head h2{font-family:Fraunces,serif;margin:0;font-size:1.35rem}.card-body{padding:1.25rem}.editor{display:none}.editor.active{display:block}.locale-tabs{display:flex;gap:.4rem}.locale-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.43rem .65rem;font:600 .65rem/1 "IBM Plex Mono",monospace}.locale-tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}.repeaters{display:grid;gap:.75rem}.repeat-card{border:1px solid var(--line);border-radius:14px;padding:.9rem;background:#fbfaf6}.repeat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.repeat-card .wide{grid-column:1/-1}.repeat-actions{display:flex;justify-content:flex-end;margin-top:.7rem}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-bottom:1rem}.visibility{display:flex;gap:.5rem;align-items:center;font-size:.82rem}.visibility input{width:auto}.savebar{display:flex;justify-content:flex-end;align-items:center;gap:.8rem;margin-top:1.2rem}.help{font-size:.76rem;color:var(--muted);line-height:1.5}.status{font:500 .7rem/1.4 "IBM Plex Mono",monospace;color:var(--muted)}.toast{position:fixed;right:1rem;bottom:1rem;background:var(--dark);color:#fff;padding:.85rem 1rem;border-radius:12px;box-shadow:0 15px 50px rgba(0,0,0,.25);opacity:0;transform:translateY(140%);transition:.25s;z-index:100}.toast.show{opacity:1;transform:none}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{display:flex}.sidebar-bottom{margin-top:1rem}.row2,.repeat-grid{grid-template-columns:1fr}}
@media(max-width:560px){.main{padding:1rem 1rem 3rem}.top{flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}.card-head{align-items:flex-start;flex-direction:column}.savebar{flex-direction:column}.savebar .btn{width:100%}}
</style>
</head>
<body>
<section class="login-wrap" id="loginView">
  <div class="login">
    <h1>Vitrine <em>Pro</em></h1>
    <p style="color:var(--muted);line-height:1.55">Fase 2: edite as principais áreas do portfólio sem tocar no código.</p>
    <form class="form" id="loginForm">
      <div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
      <div id="loginError" style="color:var(--danger);font-size:.8rem;min-height:1.1rem"></div>
      <button class="btn gold" id="loginButton">Entrar no painel</button>
    </form>
  </div>
</section>

<div class="shell hidden" id="appView">
  <aside class="sidebar">
    <div><div class="brand">Vitrine <em>Pro</em></div><div class="sub">CMS · Fase 2</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-bottom"><div class="email" id="userEmail"></div><button class="logout" id="logoutButton">Sair</button></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><div class="sub" style="color:var(--muted)">Gabriel Capellari · Site</div><h1>Gerenciar conteúdo</h1><div class="status" id="statusText">Conectando…</div></div>
      <div class="top-actions"><a class="btn ghost" href="../" target="_blank" rel="noopener">Visualizar site ↗</a></div>
    </header>
    <div class="card">
      <div class="card-head"><h2 id="editorTitle">Conteúdo</h2><div class="locale-tabs"><button class="locale-tab active" data-locale="pt">🇧🇷 PT</button><button class="locale-tab" data-locale="en">🇬🇧 EN</button></div></div>
      <div class="card-body">
        <div class="toolbar"><label class="visibility"><input id="isVisible" type="checkbox" checked> Seção visível no site</label><span class="help" id="lastSaved"></span></div>
        <div id="editorHost"></div>
        <div class="savebar"><button class="btn gold" id="saveButton">Salvar e publicar</button></div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
(() => {
  const config = window.VITRINE_SUPABASE;
  const sb = window.supabase.createClient(config.url, config.publishableKey, {auth:{persistSession:true,autoRefreshToken:true}});

  const defaults = {
    hero:{name_html:'Gabriel<br><em>Capellari</em>',location:'IBITINGA · SP · BR',role_pt:'JORNALISTA DE POKER · REPÓRTER DE TORNEIOS AO VIVO · REDATOR SEO · APRENDIZ .·.',role_en:'POKER JOURNALIST · LIVE TOURNAMENT REPORTER · SEO WRITER · LEARNER .·.',ticker:['WSOP LAS VEGAS','WSOP BRASIL','BSOP MILLIONS','LAPT PANAMÁ','BSOP/LAPT RIO','LAPT MONTEVIDÉU','WPT WORLD CHAMPIONSHIP']},
    stats:{items:[
      {num:'4+',label_pt:'anos de cobertura de poker ao vivo',label_en:'years covering live poker'},
      {num:'4',label_pt:'países cobertos — Brasil · EUA · Panamá · Uruguai',label_en:'countries covered — Brazil · USA · Panama · Uruguay'},
      {num:'4',label_pt:'grandes circuitos — WSOP · WPT · BSOP · LAPT',label_en:'major circuits — WSOP · WPT · BSOP · LAPT'},
      {num:'3',label_pt:'idiomas — Português · Inglês · Espanhol',label_en:'languages — Portuguese · English · Spanish'}
    ]},
    about:{eyebrow_pt:'Perfil',eyebrow_en:'Profile',title_pt:'Da sala de aula<br>aos feltros',title_en:'From the classroom<br>to the felt',paragraph1_pt:'Formado em Letras (Português/Inglês) pela UNESP, Gabriel construiu uma carreira que une domínio de idioma, disciplina de sala de aula e faro jornalístico. Foram oito anos ensinando inglês e literatura antes da migração para a cobertura de eventos ao vivo — uma transição que trouxe para o poker o rigor didático e a clareza de quem já formou centenas de alunos.',paragraph1_en:'With a degree in Languages (Portuguese/English) from UNESP, Gabriel built a career that blends language mastery, classroom discipline and journalistic instinct. He spent eight years teaching English and literature before moving into live-event coverage — a transition that brought teaching rigor and clarity to poker journalism.',paragraph2_pt:'Hoje soma mais de quatro anos cobrindo eventos em países que incluem Brasil, Estados Unidos, Panamá e Uruguai, produzindo conteúdo editorial e SEO para os principais veículos do setor.',paragraph2_en:'He now has more than four years of event coverage across Brazil, the United States, Panama and Uruguay, producing editorial and SEO content for leading outlets in the industry.'},
    wsop:{eyebrow_pt:'Cobertura em destaque',eyebrow_en:'Featured coverage',title_pt:'WSOP<br>Las Vegas',title_en:'WSOP<br>Las Vegas',description_pt:'Quatro edições consecutivas da World Series of Poker em Las Vegas, de 2022 a 2025 — com cobertura também do WPT World Championship em 2022. Experiência internacional em reportagem ao vivo, produção editorial e conteúdo para a audiência brasileira de poker.',description_en:'Four consecutive editions of the World Series of Poker in Las Vegas, from 2022 to 2025 — also covering the WPT World Championship in 2022. International experience in live reporting, editorial production and content for Brazilian poker audiences.',points:['2022','2023','2024','2025','Las Vegas · EUA']},
    coverage:{eyebrow_pt:'Painel de cobertura',eyebrow_en:'Coverage board',title_pt:'Torneios cobertos',title_en:'Events covered',items:[
      {event:'WSOP — Las Vegas',years:'2022 · 2023 · 2024 · 2025'},{event:'WSOP & WPT World Championship — Las Vegas',years:'2022'},{event:'WSOP Brasil',years:'2022'},{event:'BSOP Millions',years:'2022 · 2023 · 2025'},{event:'BSOP São Paulo',years:'2023 · 2024'},{event:'BSOP Winter Millions',years:'2023 · 2025 (remoto)'},{event:'BSOP / LAPT Foz do Iguaçu',years:'2023'},{event:'BSOP / LAPT Rio',years:'2024'},{event:'LAPT Montevidéu',years:'2023'},{event:'LAPT Panamá',years:'2024'}
    ]},
    portfolio:{eyebrow_pt:'Onde ler',eyebrow_en:'Where to read',title_pt:'Portfólio publicado',title_en:'Published portfolio',profile_name:'Gabriel Capellari',bio_pt:'Formado em Letras (Português/Inglês), sempre fui apaixonado por esportes e comunicação. Através das palavras, encontrei uma forma de contar histórias, aproximar pessoas e transformar experiências em conexão.',bio_en:'With a degree in Languages (Portuguese/English), I have always been passionate about sports and communication. Through words, I found a way to tell stories, connect people and turn experiences into connection.',items:[
      {name:'SuperPoker',desc_pt:'Notícias, cobertura ao vivo e entrevistas exclusivas · 2022–2024',desc_en:'News, live coverage and exclusive interviews · 2022–2024',url:'https://superpoker.com.br/info/staff/gabrielcapellari'},
      {name:'PokerNews',desc_pt:'Conteúdo editorial para o maior veículo de poker do mundo · 2025–2026',desc_en:'Editorial content for one of the world’s largest poker media outlets · 2025–2026',url:'https://br.pokernews.com/editores/gabriel-capellari/'},
      {name:'Canalhas Games',desc_pt:'Produção de conteúdo de mídia esportiva',desc_en:'Sports media content production',url:'https://www.canalhasgames.com.br/pages/quem-somos'}
    ]},
    experience:{eyebrow_pt:'Histórico de mãos',eyebrow_en:'Hand history',title_pt:'Experiência profissional',title_en:'Professional experience',items:[
      {role_pt:'Poker Footage Researcher',role_en:'Poker Footage Researcher',years:'2026',org:'World Series of Poker (WSOP) / GGPoker',note_pt:'Pesquisei imagens de torneios de poker e documentei mãos-chave, histórias de jogadores e marcações de tempo para apoiar a produção de conteúdo de uma das maiores empresas de mídia de poker do mundo.',note_en:'Researched poker tournament footage and documented key hands, player stories and timestamps to support content production for one of the world’s largest poker media companies.'},
      {role_pt:'Remote Player Researcher',role_en:'Remote Player Researcher',years:'2026',org:'World Series of Poker (WSOP) / GGPoker',note_pt:'Pesquisei jogadores profissionais de poker, levantando históricos, destaques de carreira e conquistas relevantes para apoiar a produção de conteúdo.',note_en:'Researched professional poker players, compiling backgrounds, career highlights and relevant achievements to support content production.'},
      {role_pt:'Content Writer',role_en:'Content Writer',years:'2025 — 2026',org:'PokerNews Brasil',note_pt:'Produzo conteúdo editorial e cobertura jornalística para um dos maiores veículos de poker do mundo, unindo precisão informativa a SEO estratégico.',note_en:'Produced editorial content and journalistic coverage for one of the world’s largest poker outlets, combining editorial accuracy with strategic SEO.'},
      {role_pt:'Copywriter',role_en:'Copywriter',years:'2025',org:'RegLife',note_pt:'Desenvolvi conteúdo de marketing e editorial voltado à indústria do poker, com foco em conversão e engajamento.',note_en:'Developed marketing and editorial content for the poker industry, focusing on conversion and engagement.'},
      {role_pt:'Jornalista / Content Writer',role_en:'Journalist / Content Writer',years:'2022 — 2024',org:'SuperPoker Group',note_pt:'Conduzi cobertura ao vivo de torneios, entrevistas e produção de notícias para uma das maiores plataformas de mídia de poker do Brasil, consolidando presença editorial no setor.',note_en:'Led live tournament coverage, interviews and news production for one of Brazil’s largest poker media platforms.'},
      {role_pt:'Professor de Literatura (Ensino Médio)',role_en:'High School Literature Teacher',years:'2020 — 2022',org:'Colégio Max Beny Macena',note_pt:'Lecionei literatura brasileira e portuguesa para turmas do ensino médio, desenvolvendo habilidades de comunicação e didática que hoje sustentam meu trabalho como redator e repórter.',note_en:'Taught Brazilian and Portuguese literature to high-school classes, developing communication and teaching skills that support my work as a writer and reporter.'},
      {role_pt:'Corretor de Redação',role_en:'Essay Evaluator',years:'2019 — 2021',org:'ENEM / ENCCEJA',note_pt:'Avaliei redações de candidatos em exames nacionais, aplicando critérios técnicos de coesão, argumentação e norma culta.',note_en:'Evaluated candidate essays in national examinations, applying technical standards for cohesion, argumentation and formal language.'},
      {role_pt:'Professor de Inglês',role_en:'English Teacher',years:'2014 — 2022',org:'Escola LYVA',note_pt:'Lecionei inglês para turmas do fundamental ao médio, construindo a base do domínio fluente (C2) que hoje aplico no jornalismo internacional.',note_en:'Taught English from elementary through high-school levels, building the fluent command I now apply in international journalism.'},
      {role_pt:'Professor de Inglês',role_en:'English Teacher',years:'2017 — 2022',org:'Escola EDUCARE',note_pt:'Conduzi aulas de inglês para o ensino fundamental, reforçando fundamentos de leitura, escrita e conversação.',note_en:'Taught English in elementary school, reinforcing foundations of reading, writing and conversation.'},
      {role_pt:'Assistente de Laboratório de TI',role_en:'IT Lab Assistant',years:'2011 — 2013',org:'Prescon Informática Assessoria LTDA',note_pt:'Prestei suporte técnico e apoio operacional em laboratórios de informática.',note_en:'Provided technical and operational support in computer labs.'}
    ]},
    education:{eyebrow_pt:'Fundamentos',eyebrow_en:'Foundations',title_pt:'Formação & ferramentas',title_en:'Education & tools',skills_title_pt:'Idiomas & ferramentas — mesa de fichas',skills_title_en:'Languages & tools — chip stack',items:[
      {degree_pt:'Bacharelado e Licenciatura em Letras (Português/Inglês)',degree_en:'BA and Teaching Degree in Languages (Portuguese/English)',institution:'UNESP — Araraquara · 2018/2019'},
      {degree_pt:'Técnico em Informática',degree_en:'IT Technician',institution:'Centro Paula Souza — ETEC Ibitinga · 2010'},
      {degree_pt:'Certificação em SEO Best Practices',degree_en:'SEO Best Practices Certification',institution:'Better Collective · 2024'}
    ],skills:['Inglês C1','Espanhol B1','SEO','Cobertura ao vivo','ChatGPT · Gemini · Claude','Canva','CapCut','Google Workspace','Microsoft Office','CNH categoria AB']},
    instagram:{eyebrow_pt:'Bastidores',eyebrow_en:'Behind the scenes',title_pt:'Também no Instagram',title_en:'Also on Instagram',text_pt:'Bastidores de mesa final, viagens de cobertura e o dia a dia da vida de repórter — tudo por lá.',text_en:'Final-table behind the scenes, reporting trips and everyday reporter life — all there.',user:'gabrielcapellari',reel_url:'https://www.instagram.com/p/DZK3eH_uRzP/'},
    contact:{title_pt:'Contato',title_en:'Contact',email1:'gcapellari@hotmail.com',email2:'gcapellari1@gmail.com',whatsapp_number:'5516997168229',whatsapp_display:'+55 16 99716-8229',instagram_user:'gabrielcapellari',linkedin_url:'https://www.linkedin.com/in/gabriel-capellari-5347ba14b/'}
  };

  const defs = {
    hero:{title:'Hero',fields:[['name_html','Nome (HTML)','text'],['location','Localização','text'],['role','Cargo / posicionamento','textarea']],lists:[['ticker','Faixa de eventos',['value']]]},
    stats:{title:'Números',lists:[['items','Estatísticas',['num','label']]]},
    about:{title:'Sobre',fields:[['eyebrow','Etiqueta','text'],['title','Título','text'],['paragraph1','Primeiro parágrafo','textarea'],['paragraph2','Segundo parágrafo','textarea']]},
    wsop:{title:'Destaque WSOP',fields:[['eyebrow','Etiqueta','text'],['title','Título','text'],['description','Descrição','textarea']],lists:[['points','Marcadores',['value']]]},
    coverage:{title:'Coberturas',fields:[['eyebrow','Etiqueta','text'],['title','Título','text']],lists:[['items','Torneios',['event','years']]]},
    portfolio:{title:'Portfólio',fields:[['eyebrow','Etiqueta','text'],['title','Título','text'],['profile_name','Nome exibido','text'],['bio','Biografia curta','textarea']],lists:[['items','Links publicados',['name','desc','url']]]},
    experience:{title:'Experiência',fields:[['eyebrow','Etiqueta','text'],['title','Título','text']],lists:[['items','Experiências',['role','years','org','note']]]},
    education:{title:'Formação',fields:[['eyebrow','Etiqueta','text'],['title','Título','text'],['skills_title','Título das ferramentas','text']],lists:[['items','Formação acadêmica',['degree','institution']],['skills','Ferramentas / idiomas',['value']]]},
    instagram:{title:'Instagram',fields:[['eyebrow','Etiqueta','text'],['title','Título','text'],['text','Texto','textarea'],['user','Usuário','text'],['reel_url','URL do Reels','text']]},
    contact:{title:'Contato',fields:[['title','Título','text'],['email1','E-mail principal','text'],['email2','E-mail alternativo','text'],['whatsapp_number','WhatsApp — número só dígitos','text'],['whatsapp_display','WhatsApp — texto exibido','text'],['instagram_user','Instagram','text'],['linkedin_url','LinkedIn URL','text']]}
  };

  const order=['hero','stats','about','wsop','coverage','portfolio','experience','education','instagram','contact'];
  let user=null, project=null, rows=new Map(), currentKey='hero', locale='pt';

  const $=id=>document.getElementById(id), host=$('editorHost'), toast=$('toast');
  const localeKey = base => `${base}_${locale}`;

  function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),2300)}
  function fieldValue(content,key){
    if (['name_html','location','profile_name','user','reel_url','email1','email2','whatsapp_number','whatsapp_display','instagram_user','linkedin_url'].includes(key)) return content[key]??'';
    return content[localeKey(key)] ?? content[`${key}_pt`] ?? '';
  }
  function setField(content,key,value){
    if (['name_html','location','profile_name','user','reel_url','email1','email2','whatsapp_number','whatsapp_display','instagram_user','linkedin_url'].includes(key)) content[key]=value;
    else content[localeKey(key)]=value;
  }
  function labelsFor(prop){
    const m={num:'Número',label:'Legenda',event:'Evento',years:'Ano(s)',name:'Nome',desc:'Descrição',url:'URL',role:'Cargo',org:'Empresa / organização',note:'Descrição',degree:'Formação',institution:'Instituição / detalhes',value:'Item'};
    return m[prop]||prop;
  }

  function renderNav(){
    $('nav').innerHTML=order.map(k=>`<button data-key="${k}" class="${k===currentKey?'active':''}">${defs[k].title}</button>`).join('');
    $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{currentKey=b.dataset.key;renderNav();renderEditor()});
  }

  function renderEditor(){
    const def=defs[currentKey], row=rows.get(currentKey), content=structuredClone(row?.content || defaults[currentKey]);
    $('editorTitle').textContent=def.title;
    $('isVisible').checked=row?.is_visible!==false;
    $('lastSaved').textContent=row?.updated_at?'Última atualização: '+new Date(row.updated_at).toLocaleString('pt-BR'):'';

    let markup='<div class="form">';
    for(const [key,label,type] of (def.fields||[])){
      const value=fieldValue(content,key);
      markup+=`<div class="field"><label>${label}</label>${type==='textarea'
        ? `<textarea data-field="${key}">${String(value).replaceAll('&','&amp;').replaceAll('<','&lt;')}</textarea>`
        : `<input data-field="${key}" value="${String(value).replaceAll('&','&amp;').replaceAll('"','&quot;')}">`}</div>`;
    }
    markup+='</div>';

    for(const [listKey,title,props] of (def.lists||[])){
      markup+=`<div style="margin-top:1.35rem"><div class="toolbar"><strong>${title}</strong><button class="btn ghost" type="button" data-add="${listKey}">+ Adicionar</button></div><div class="repeaters" data-list="${listKey}"></div></div>`;
    }
    host.innerHTML=markup;
    host.__working=content;

    host.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>setField(host.__working,el.dataset.field,el.value));
    host.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{
      const list=btn.dataset.add; host.__working[list]=host.__working[list]||[];
      const defList=(def.lists||[]).find(x=>x[0]===list); const obj={};
      for(const p of defList[2]) obj[p==='label'||p==='desc'||p==='role'||p==='note'||p==='degree' ? `${p}_${locale}` : p]='';
      host.__working[list].push(defList[2].length===1?'':obj); renderRepeaters();
    });
    renderRepeaters();
  }

  function renderRepeaters(){
    const def=defs[currentKey], c=host.__working;
    for(const [listKey,title,props] of (def.lists||[])){
      const wrap=host.querySelector(`[data-list="${listKey}"]`); if(!wrap) continue;
      const arr=c[listKey]||[];
      wrap.innerHTML=arr.map((item,i)=>{
        const obj=props.length===1 ? {value:item} : item;
        const fields=props.map(p=>{
          const localized=['label','desc','role','note','degree'].includes(p);
          const key=localized?`${p}_${locale}`:p;
          const val=obj?.[key] ?? (localized?obj?.[`${p}_pt`]:obj?.[p]) ?? '';
          const wide=['desc','note','url'].includes(p)?' wide':'';
          return `<div class="field${wide}"><label>${labelsFor(p)}</label>${['note','desc'].includes(p)
            ? `<textarea data-list-field="${listKey}" data-index="${i}" data-prop="${p}">${String(val).replaceAll('&','&amp;').replaceAll('<','&lt;')}</textarea>`
            : `<input data-list-field="${listKey}" data-index="${i}" data-prop="${p}" value="${String(val).replaceAll('&','&amp;').replaceAll('"','&quot;')}">`}</div>`;
        }).join('');
        return `<div class="repeat-card"><div class="repeat-grid">${fields}</div><div class="repeat-actions"><button class="btn danger" type="button" data-remove="${listKey}" data-index="${i}">Remover</button></div></div>`;
      }).join('');

      wrap.querySelectorAll('[data-list-field]').forEach(el=>el.oninput=()=>{
        const list=el.dataset.listField, i=+el.dataset.index, p=el.dataset.prop;
        if(props.length===1){c[list][i]=el.value;return}
        const localized=['label','desc','role','note','degree'].includes(p);
        c[list][i][localized?`${p}_${locale}`:p]=el.value;
      });
      wrap.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>{c[btn.dataset.remove].splice(+btn.dataset.index,1);renderRepeaters()});
    }
  }

  async function ensureProject(){
    let {data,error}=await sb.from('projects').select('*').eq('owner_id',user.id).eq('slug',config.projectSlug).maybeSingle();
    if(error) throw error;
    if(data) return data;
    const result=await sb.from('projects').insert({owner_id:user.id,slug:config.projectSlug,name:'Gabriel Capellari',site_type:'portfolio',is_published:true}).select().single();
    if(result.error) throw result.error; return result.data;
  }

  async function seedAndLoad(){
    const q=await sb.from('site_content').select('*').eq('project_id',project.id);
    if(q.error) throw q.error;
    rows=new Map((q.data||[]).map(r=>[r.section_key,r]));
    for(const key of order){
      if(rows.has(key)) continue;
      const ins=await sb.from('site_content').insert({project_id:project.id,section_key:key,content:defaults[key],is_visible:true,sort_order:order.indexOf(key)*10}).select().single();
      if(ins.error) throw ins.error; rows.set(key,ins.data);
    }
  }

  async function openApp(sessionUser){
    user=sessionUser;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userEmail').textContent=user.email||'';$('statusText').textContent='Carregando conteúdo…';
    try{project=await ensureProject();await seedAndLoad();$('statusText').textContent='Site conectado · Fase 2 ativa';renderNav();renderEditor()}
    catch(e){console.error(e);$('statusText').textContent='Erro de conexão';notify('Erro ao carregar. Confira o Supabase.')}
  }

  $('loginForm').onsubmit=async e=>{
    e.preventDefault();$('loginError').textContent='';$('loginButton').disabled=true;$('loginButton').textContent='Entrando…';
    const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    $('loginButton').disabled=false;$('loginButton').textContent='Entrar no painel';
    if(error){$('loginError').textContent='Não foi possível entrar. Verifique e-mail e senha.';return}
    openApp(data.user);
  };
  $('logoutButton').onclick=async()=>{await sb.auth.signOut();location.reload()};

  document.querySelectorAll('.locale-tab').forEach(tab=>tab.onclick=()=>{
    locale=tab.dataset.locale;document.querySelectorAll('.locale-tab').forEach(x=>x.classList.toggle('active',x===tab));renderEditor()
  });

  $('saveButton').onclick=async()=>{
    const row=rows.get(currentKey); if(!row) return;
    const btn=$('saveButton');btn.disabled=true;btn.textContent='Salvando…';
    try{
      const ver=await sb.from('site_versions').insert({project_id:project.id,section_key:currentKey,content:row.content,created_by:user.id});
      if(ver.error) throw ver.error;
      const upd=await sb.from('site_content').update({content:host.__working,is_visible:$('isVisible').checked,updated_at:new Date().toISOString()}).eq('id',row.id).select().single();
      if(upd.error) throw upd.error;
      rows.set(currentKey,upd.data);notify('Alterações publicadas ✓');renderEditor()
    }catch(e){console.error(e);notify('Erro ao salvar.')}
    finally{btn.disabled=false;btn.textContent='Salvar e publicar'}
  };

  sb.auth.getSession().then(({data})=>{if(data.session?.user)openApp(data.session.user)});
})();
</script>
