<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WebAppCap — Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--shadow:0 18px 55px rgba(8,39,32,.11)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:#082720;padding:1rem}.login-card,.template{background:#fff;border:1px solid var(--line);border-radius:18px}.login-card{width:min(430px,100%);padding:2rem}h1,h2,h3{font-family:Fraunces,serif}.btn{border:0;border-radius:999px;padding:.72rem .92rem;font:600 .68rem "IBM Plex Mono",monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:#082720}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.field{display:grid;gap:.4rem}.field label{font:600 .66rem "IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase}.field input{width:100%;padding:.8rem;border:1px solid var(--line);border-radius:10px}.shell{max-width:1180px;margin:auto;padding:2rem 1rem 4rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.4rem}.top h1{font-size:clamp(2.2rem,5vw,3.3rem);margin:0}.top p,.help{color:var(--muted)}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.template{overflow:hidden;box-shadow:var(--shadow)}.visual{min-height:180px;padding:1.2rem;display:flex;align-items:flex-end}.visual h3{font-size:2rem;margin:0}.body{padding:1.15rem}.body p{color:var(--muted);line-height:1.5}.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}.chip{padding:.32rem .48rem;border-radius:999px;background:#f2efe6;font-size:.7rem}.template-footer{display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap}.warning{background:#fff8df;border:1px solid #ead9a0;padding:.9rem 1rem;border-radius:12px;color:#6d5a1e;font-size:.78rem;line-height:1.5;margin-bottom:1rem}.active{outline:3px solid var(--gold);outline-offset:2px}.toast{position:fixed;right:1rem;bottom:1rem;background:#082720;color:#fff;padding:.85rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:800px){.templates{grid-template-columns:1fr}.top{flex-direction:column}.actions .btn{flex:1}}
</style><style id="dashboard-shortcut-style">.dashboard-shortcut{position:fixed;right:16px;top:16px;z-index:9999;background:#082720;color:#fff!important;text-decoration:none;border-radius:999px;padding:.58rem .75rem;font:600 .62rem "IBM Plex Mono",monospace;box-shadow:0 8px 25px rgba(8,39,32,.18)}@media(max-width:620px){.dashboard-shortcut{top:auto;bottom:14px;right:14px}}</style><link rel="stylesheet" href="/admin/ux.css">
</head><body><a class="dashboard-shortcut" id="dashboardShortcut" href="/admin/dashboard.html">Dashboard</a>
<section class="login" id="loginView"><div class="login-card"><h1 style="margin:0">WebApp<span style="color:#c9a227">Cap</span></h1><p class="help">Entre para escolher um template.</p><form id="loginForm" style="display:grid;gap:.9rem"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><div id="err" style="color:#a83c2e;font-size:.8rem"></div><button class="btn gold">Entrar</button></form></div></section>
<main class="shell hidden" id="app"><header class="top"><div><div style="font:600 .65rem 'IBM Plex Mono',monospace;color:var(--muted)">WEBAPPCAP · CMS</div><h1>Templates</h1><p id="projectLabel"></p></div><div class="actions"><a class="btn ghost" id="contentLink">← Conteúdo</a><a class="btn ghost" id="structureLink">Estrutura</a><a class="btn ghost" id="themeLink">Aparência</a><a class="btn ghost" id="previewLink" target="_blank">Preview ↗</a></div></header>
<div class="warning"><strong>Aplicar template não apaga textos, fotos, SEO, histórico ou domínio.</strong> Ele altera a estrutura e a aparência do rascunho. Revise no Preview antes de publicar.</div><section class="templates" id="templates"></section></main><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<script src="/admin/route-guard.js"></script><script src="../project-context.js"></script>
<script>
(() => {
 const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let user=null,project=null,myRole=null,snapshot=null,currentTemplate='custom',commercialPlan=null;const slug=()=>window.VITRINE_PROJECT_CONTEXT?.slug||cfg.projectSlug;function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}
 const presets={
  editorial:{name:'Editorial / Jornalista',desc:'Template editorial premium inspirado na composição do WebAppCap: narrativa, credibilidade, trabalhos publicados e trajetória profissional.',visual:'linear-gradient(145deg,#082720 0%,#0e3b2e 58%,#164b3c 100%)',color:'#fff',chips:['Narrativa editorial','Trabalho em destaque','Onde ler','Timeline'],layout:[
    ['ticker',true,'editorial-marquee'],
    ['stats',true,'editorial-metrics'],
    ['about',true,'editorial-profile'],
    ['wsop',true,'editorial-feature'],
    ['coverage',true,'editorial-board'],
    ['portfolio',true,'editorial-press'],
    ['experience',true,'editorial-timeline'],
    ['education',true,'editorial-foundations'],
    ['instagram',true,'editorial-social'],
    ['contact',true,'editorial-contact']
  ],theme:{colors:{primary:'#082720',secondary:'#0e3b2e',accent:'#e3bb3d',background:'#f7f4ec',surface:'#ffffff',text:'#171310',muted:'#728078'},typography:{heading:'Fraunces',body:'Inter',mono:'IBM Plex Mono',scale:'normal'},layout:{content_width:'1200',section_spacing:'normal',radius:'medium',density:'comfortable'},buttons:{style:'pill',weight:'600'},effects:{shadow:'soft',motion:'normal'}}},
  fitness:{name:'Personal Trainer Signature',desc:'Para personal trainers e profissionais de performance: impacto visual, vídeos, agenda, serviços, prova social e conversão.',visual:'linear-gradient(145deg,#0d0f0f 0%,#171b19 60%,#202820 100%)',color:'#fff',chips:['3 vídeos','Agenda','Serviços','Resultados'],layout:[
    ['fitness_videos',true,'fitness-reels'],
    ['fitness_schedule',true,'fitness-schedule'],
    ['stats',true,'fitness-proof'],
    ['about',true,'fitness-profile'],
    ['coverage',true,'fitness-services'],
    ['wsop',true,'fitness-method'],
    ['portfolio',true,'fitness-results'],
    ['experience',true,'fitness-experience'],
    ['education',true,'fitness-credentials'],
    ['instagram',true,'fitness-social'],
    ['contact',true,'fitness-contact'],
    ['ticker',false,'compact']
  ],theme:{colors:{primary:'#101312',secondary:'#1d2420',accent:'#d9ff43',background:'#f4f4ef',surface:'#ffffff',text:'#141615',muted:'#6d746f'},typography:{heading:'Montserrat',body:'DM Sans',mono:'IBM Plex Mono',scale:'large'},layout:{content_width:'1200',section_spacing:'normal',radius:'large',density:'comfortable'},buttons:{style:'pill',weight:'700'},effects:{shadow:'strong',motion:'normal'},guardrails:{enabled:true,palette_mode:'performance'}}},
  educator:{name:'Professor / Consultor',desc:'Professores, consultores, mentores e cursos.',visual:'linear-gradient(145deg,#152a44,#325e7c)',color:'#fff',chips:['Metodologia','Formação','Contato'],layout:[['about',true,'image-left'],['stats',true,'split'],['portfolio',true,'list'],['experience',true,'timeline'],['education',true,'split'],['instagram',true,'minimal'],['contact',true,'centered'],['ticker',false,'compact'],['wsop',false,'compact'],['coverage',false,'compact']],theme:{colors:{primary:'#152a44',secondary:'#244c67',accent:'#f0b84b',background:'#f7f8fb',surface:'#ffffff',text:'#17202a',muted:'#687684'},typography:{heading:'Playfair Display',body:'Manrope',mono:'IBM Plex Mono',scale:'normal'},layout:{content_width:'1080',section_spacing:'airy',radius:'medium',density:'comfortable'},buttons:{style:'soft',weight:'600'},effects:{shadow:'soft',motion:'subtle'}}},
  local:{name:'Comércio Local',desc:'Restaurantes, lojas, barbearias, salões e negócios locais.',visual:'linear-gradient(145deg,#4b241d,#8a4b37)',color:'#fff',chips:['Instagram','Contato','Serviços'],layout:[['about',true,'centered'],['portfolio',true,'cards'],['instagram',true,'featured'],['contact',true,'centered'],['stats',false,'minimal'],['ticker',false,'compact'],['wsop',false,'compact'],['coverage',false,'compact'],['experience',false,'compact'],['education',false,'compact']],theme:{colors:{primary:'#4b241d',secondary:'#754234',accent:'#e4b66e',background:'#fbf7f1',surface:'#ffffff',text:'#2b201c',muted:'#806f65'},typography:{heading:'Playfair Display',body:'DM Sans',mono:'IBM Plex Mono',scale:'normal'},layout:{content_width:'1100',section_spacing:'normal',radius:'large',density:'spacious'},buttons:{style:'soft',weight:'700'},effects:{shadow:'soft',motion:'subtle'}}}
 };
 function render(){$('templates').innerHTML=Object.entries(presets).map(([key,t])=>`<article class="template ${currentTemplate===key?'active':''}"><div class="visual" style="background:${t.visual};color:${t.color}"><div><span style="font:600 .58rem 'IBM Plex Mono',monospace;letter-spacing:.07em;opacity:.7">${key==='editorial'?'SIGNATURE · WEBAPPCAP':'PRESET'}</span><h3>${t.name}</h3></div></div><div class="body"><p>${t.desc}</p><div class="chips">${t.chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="template-footer"><span style="font:600 .66rem 'IBM Plex Mono',monospace;color:var(--muted)">${currentTemplate===key?'ATIVO':'PRESET'}</span><button class="btn ${currentTemplate===key?'ghost':'gold'}" data-apply="${key}">${currentTemplate===key?'Reaplicar':'Aplicar template'}</button></div></div></article>`).join('');document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>applyTemplate(b.dataset.apply))}
 
  async function loadPlanLimits(){
    const q=await sb.from('project_commercial').select('plan_code,limits,status').eq('project_id',project.id).maybeSingle();
    if(q.error){console.warn('Plano comercial indisponível:',q.error.message);return {plan_code:'pro',status:'active',limits:{client_users:1,custom_domain:true,templates:true,advanced_theme:true,media_gallery:20}}}
    return q.data||{plan_code:'pro',status:'active',limits:{client_users:1,custom_domain:true,templates:true,advanced_theme:true,media_gallery:20}};
  }

async function applyTemplate(key){const t=presets[key];if(!t)return;const ok=await window.WebAppCapUX.confirm({title:'Aplicar template?',message:`O template "${t.name}" substituirá estrutura e aparência atuais do rascunho.`,confirmText:'Aplicar template',danger:true});if(!ok)return;if(key==='fitness'){
  if(!snapshot.fitness_videos)snapshot.fitness_videos={content:{eyebrow_pt:'Em movimento',eyebrow_en:'In motion',title_pt:'Treino na prática',title_en:'Training in action',subtitle_pt:'Conheça meu trabalho em vídeos curtos.',subtitle_en:'See my work in short videos.',items:[{title_pt:'',title_en:'',url:'',path:'',kind:''},{title_pt:'',title_en:'',url:'',path:'',kind:''},{title_pt:'',title_en:'',url:'',path:'',kind:''}]},is_visible:true};
  if(!snapshot.fitness_schedule)snapshot.fitness_schedule={content:{eyebrow_pt:'Agenda',eyebrow_en:'Schedule',title_pt:'Horários disponíveis',title_en:'Available times',subtitle_pt:'Consulte os horários e fale comigo para reservar.',subtitle_en:'Check available times and contact me to book.',cta_label_pt:'Quero reservar um horário',cta_label_en:'Book a time',schedule_url:'',slots:[]},is_visible:true};
}snapshot.layout={content:{version:1,modules:t.layout.map(([key,visible,variant],order)=>({key,visible,variant,order}))},is_visible:true};snapshot.theme={content:structuredClone(t.theme),is_visible:true};snapshot.template={content:{key,name:t.name,applied_at:new Date().toISOString()},is_visible:true};const u=await sb.from('project_drafts').update({snapshot,updated_by:user.id,updated_at:new Date().toISOString()}).eq('project_id',project.id).select().single();if(u.error){console.error(u.error);toast('Erro ao aplicar template.');return}snapshot=structuredClone(u.data.snapshot||{});currentTemplate=key;render();toast('Template aplicado ao rascunho ✓')}
 async function load(){const p=await sb.from('projects').select('*').eq('slug',slug()).maybeSingle();if(p.error||!p.data)throw p.error||new Error('Projeto não encontrado');project=p.data;commercialPlan=await loadPlanLimits();if(commercialPlan?.limits?.templates===false){location.replace(`/admin/plan.html?project=${encodeURIComponent(project.slug)}`);return}const m=await sb.from('project_members').select('role').eq('project_id',project.id).eq('user_id',user.id).maybeSingle();if(m.error)throw m.error;myRole=m.data?.role||null;if(!['owner','admin'].includes(myRole)){toast('Templates disponíveis somente para Owner/Admin.');setTimeout(()=>location.href=`/admin/?project=${encodeURIComponent(project.slug)}`,700);return}const d=await sb.from('project_drafts').select('*').eq('project_id',project.id).maybeSingle();if(d.error||!d.data)throw d.error||new Error('Rascunho não encontrado');snapshot=structuredClone(d.data.snapshot||{});currentTemplate=snapshot?.template?.content?.key||'custom';$('projectLabel').textContent=`${project.name} · ${project.slug}`;$('contentLink').href=`/admin/?project=${encodeURIComponent(project.slug)}`;$('structureLink').href=`/admin/structure.html?project=${encodeURIComponent(project.slug)}`;$('themeLink').href=`/admin/theme.html?project=${encodeURIComponent(project.slug)}`;$('previewLink').href=`/preview.html?preview=draft&project=${encodeURIComponent(project.slug)}`;render()}
 async function open(u){user=u;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');try{await load()}catch(e){console.error(e);toast('Não foi possível carregar os templates.')}}$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('err').textContent='E-mail ou senha inválidos.';return}open(r.data.user)};sb.auth.getSession().then(({data})=>{if(data.session?.user)open(data.session.user)});
})();
</script><script>(()=>{const a=document.getElementById('dashboardShortcut');if(!a)return;const p=new URLSearchParams(location.search).get('project');if(p)a.href='/admin/dashboard.html?project='+encodeURIComponent(p)})();</script><script src="/admin/ux.js"></script>
</body></html>
