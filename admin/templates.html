<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WebAppCap — Templates</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet"><style>:root{--dark:#082720;--paper:#f7f4ec;--ink:#171310;--gold:#e3bb3d;--muted:#728078;--line:#ded8c8;--shadow:0 18px 55px rgba(8,39,32,.11)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:#082720;padding:1rem}.login-card,.template{background:#fff;border:1px solid var(--line);border-radius:18px}.login-card{width:min(430px,100%);padding:2rem}h1,h2,h3{font-family:Fraunces,serif}.btn{border:0;border-radius:999px;padding:.72rem .92rem;font:600 .68rem "IBM Plex Mono",monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--gold);color:#082720}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.field{display:grid;gap:.4rem}.field label{font:600 .66rem "IBM Plex Mono",monospace;color:var(--muted);text-transform:uppercase}.field input{width:100%;padding:.8rem;border:1px solid var(--line);border-radius:10px}.shell{max-width:1180px;margin:auto;padding:2rem 1rem 4rem}.top{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1.4rem}.top h1{font-size:clamp(2.2rem,5vw,3.3rem);margin:0}.top p,.help{color:var(--muted)}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.templates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.template{overflow:hidden;box-shadow:var(--shadow)}.visual{min-height:180px;padding:1.2rem;display:flex;align-items:flex-end}.visual h3{font-size:2rem;margin:0}.body{padding:1.15rem}.body p{color:var(--muted);line-height:1.5}.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}.chip{padding:.32rem .48rem;border-radius:999px;background:#f2efe6;font-size:.7rem}.template-footer{display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap}.warning{background:#fff8df;border:1px solid #ead9a0;padding:.9rem 1rem;border-radius:12px;color:#6d5a1e;font-size:.78rem;line-height:1.5;margin-bottom:1rem}.active{outline:3px solid var(--gold);outline-offset:2px}.toast{position:fixed;right:1rem;bottom:1rem;background:#082720;color:#fff;padding:.85rem 1rem;border-radius:12px;opacity:0;transform:translateY(130%);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:800px){.templates{grid-template-columns:1fr}.top{flex-direction:column}.actions .btn{flex:1}}</style><style id="dashboard-shortcut-style">.dashboard-shortcut{position:fixed;right:16px;top:16px;z-index:9999;background:#082720;color:#fff!important;text-decoration:none;border-radius:999px;padding:.58rem .75rem;font:600 .62rem "IBM Plex Mono",monospace;box-shadow:0 8px 25px rgba(8,39,32,.18)}@media(max-width:620px){.dashboard-shortcut{top:auto;bottom:14px;right:14px}}</style><link rel="stylesheet" href="/admin/ux.css"></head><body><a class="dashboard-shortcut" href="/admin/dashboard.html">Dashboard</a><section class="login" id="loginView"><div class="login-card"><h1 style="margin:0">WebApp<span style="color:#c9a227">Cap</span></h1><p class="help">Entre para escolher um template.</p><form id="loginForm" style="display:grid;gap:.9rem"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Senha</label><input id="password" type="password" required></div><div id="err" style="color:#a83c2e;font-size:.8rem"></div><button class="btn gold">Entrar</button></form></div></section><main class="shell hidden" id="app"><header class="top"><div><div style="font:600 .65rem 'IBM Plex Mono',monospace;color:var(--muted)">WEBAPPCAP · CMS</div><h1>Templates</h1><p id="projectLabel"></p></div><div class="actions"><a class="btn ghost" id="contentLink">← Conteúdo</a><a class="btn ghost" id="structureLink">Estrutura</a><a class="btn ghost" id="themeLink">Aparência</a><a class="btn ghost" id="previewLink" target="_blank">Preview ↗</a></div></header><div class="warning"><strong>Fonte única de templates.</strong> Aplicar um template preserva o conteúdo do projeto e substitui apenas a estrutura, aparência e módulos-base do rascunho.</div><section class="templates" id="templates"></section></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="/admin/route-guard.js"></script><script src="../project-context.js"></script><script src="/template-registry.js"></script><script src="/template-content.js"></script><script src="/template-contract.js"></script><script src="/admin/ux.js"></script><script src="/admin/templates-v2.js"></script></body></html>
