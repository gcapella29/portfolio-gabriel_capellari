<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar acesso — WebAppCap</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--d:#082720;--f:#0e3b2e;--p:#f7f4ec;--i:#171310;--g:#e3bb3d;--m:#728078;--l:#ded8c8;--bad:#aa4638}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,var(--d),var(--f));font-family:Inter,sans-serif;padding:1rem}.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:2rem;box-shadow:0 22px 70px rgba(0,0,0,.2)}h1{font:700 2.2rem Fraunces,serif;margin:.2rem 0 .5rem}p{color:var(--m);line-height:1.55}.field{display:grid;gap:.4rem;margin:1rem 0}.field label{font:600 .65rem 'IBM Plex Mono',monospace;text-transform:uppercase;color:var(--m)}input{width:100%;padding:.85rem;border:1px solid var(--l);border-radius:11px;font:inherit}.btn{border:0;border-radius:999px;padding:.78rem 1rem;font:600 .68rem 'IBM Plex Mono',monospace;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.gold{background:var(--g);color:var(--d);width:100%}.ghost{margin-top:.75rem;color:var(--i)}.msg{font-size:.8rem;margin-top:.8rem}.ok{color:#277a52}.err{color:var(--bad)}
</style>
</head><body><main class="card"><div style="font:600 .65rem 'IBM Plex Mono',monospace;color:var(--m)">WEBAPPCAP · ACESSO</div><h1>Recuperar senha</h1><p>Informe o e-mail da sua conta. Enviaremos um link seguro para criar uma nova senha.</p><form id="form"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><button class="btn gold" id="send">Enviar link de recuperação</button><div id="msg" class="msg"></div></form><a class="btn ghost" href="/admin/">← Voltar ao login</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>
(()=>{const cfg=window.VITRINE_SUPABASE,sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();const btn=$('send'),msg=$('msg');btn.disabled=true;btn.textContent='Enviando…';msg.textContent='';msg.className='msg';try{const redirectTo=`${location.origin}/admin/reset-password.html`;const {error}=await sb.auth.resetPasswordForEmail($('email').value.trim(),{redirectTo});if(error)throw error;msg.textContent='Se esse e-mail estiver cadastrado, você receberá o link em instantes.';msg.className='msg ok';}catch(error){console.error(error);msg.textContent='Não foi possível enviar agora. Tente novamente em alguns minutos.';msg.className='msg err';}finally{btn.disabled=false;btn.textContent='Enviar link de recuperação'}}})();
</script></body></html>
